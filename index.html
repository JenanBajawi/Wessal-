/* =========================================================
   Simulation service (one instance per trip, shared clock)
   ========================================================= */
const isMoving = t => t.rt.status === 'in_progress' && t.rt.sim.running;
const anyRunning = () => TRIPS.some(isMoving);
function advance(dm, skip){
  state.clock += dm;
  for (const t of TRIPS) if (t !== skip && isMoving(t)) stepTrip(t, dm);
}
function advanceBy(total, skip){ while (total > 1e-6){ const d = Math.min(0.1, total); advance(d, skip); total -= d; } }

function stepTrip(t, dm){
  const sim = t.rt.sim, R = t.route;
  if (sim.hold > 0) sim.hold = Math.max(0, sim.hold - dm);
  else if (sim.dwell > 0) sim.dwell = Math.max(0, sim.dwell - dm);
  else {
    const n = nextStopIdx(t);
    if (n < 0){ sim.running = false; return; }
    const target = R.stops[n];
    const np = sim.progress + dm * R.speed;
    if (state.scriptedTraffic && R.traffic && !sim.trafficDone && sim.progress < R.trafficAt && np >= R.trafficAt){
      sim.progress = R.trafficAt; sim.trafficDone = true;
      addDelay(t, 3, `ازدحام مروري قرب ${R.stops[1].short}`);
    } else if (np >= target.dist){
      sim.progress = target.dist; arriveAt(t, n);
    } else sim.progress = np;
  }
  checkThresholds(t);
}

function arriveAt(t, k){
  const s = t.route.stops[k], sim = t.rt.sim;
  sim.lastStop = k;
  if (s.destination){
    sim.running = false; sim.dwell = 0; t.rt.arrivedAt = state.clock;
    log(`وصلت ${t.bus} إلى ${t.campus.name}`, 'flag', tripAud(t));
    notify(drvAud(t), { type:'success', title:`وصلت إلى ${t.campus.name}`, body:'أنهِ الرحلة من لوحة الرحلة بعد نزول جميع الطالبات.' });
    notify('admin', { type:'success', title:`وصلت ${t.bus} إلى ${t.campus.name}`, body:`صعدت ${boardedRes(t).length} من ${bookedRes(t).length} طالبات مسجلات.` });
    const r = myRes();
    if (r && r.tripId === t.id && r.boarded) notify('student', { type:'success', title:`وصلتِ إلى ${t.campus.name}`, body:'يومك موفق! انتهت رحلتك الصباحية.' });
    return;
  }
  sim.dwell = DWELL;
  const waiting = bookedRes(t).filter(x => x.stopId === s.id && !x.boarded).length;
  log(`وصلت ${t.bus} إلى محطة ${s.short}`, 'map-pin', ['admin', drvAud(t)]);
  if (k > 0) notify(drvAud(t), { type:'trip', title:`محطة ${s.short}`, body: waiting ? `${studentsAr(waiting)} بانتظار الصعود. أكّد صعود كل طالبة من القائمة.` : 'لا توجد طالبات مسجلات في هذه المحطة.' });
  const r = myRes();
  if (r && r.tripId === t.id && r.stopId === s.id && !r.flags.arrived){
    r.flags.arrived = true;
    notify('student', { type:'arrival', title:'وصل الباص', body:'وصل الباص إلى نقطة الالتقاء. يمكنك التوجه للصعود.' });
    log('وصل الباص إلى نقطة الالتقاء الخاصة بك', 'map-pin', ['student']);
  }
}

function checkThresholds(t){
  const r = myRes();
  if (!r || r.tripId !== t.id || t.rt.status !== 'in_progress') return;
  const s = stopOf(t, r.stopId), f = r.flags;
  if (t.rt.sim.progress >= s.dist - EPS) return;
  const e = eta(t, s.idx);
  if (e <= 5.0001 && !f.n5){
    f.n5 = true;
    notify('student', { type:'arrival', title:'باصك على بُعد 5 دقائق', body:'باصك سيصل خلال 5 دقائق تقريبًا، استعدي للخروج.' });
    log('الباص على بُعد 5 دقائق من نقطة الالتقاء', 'timer', ['student']);
  } else if (e <= 2.0001 && f.n5 && !f.n2){
    f.n2 = true;
    notify('student', { type:'arrival', title:'اقترب الباص', body:'الباص يقترب من نقطة الالتقاء الخاصة بك.' });
    log('الباص يقترب من نقطة الالتقاء', 'navigation', ['student']);
  }
}

function addDelay(t, min, reason){
  const r = myRes(), mine = r && r.tripId === t.id ? stopOf(t, r.stopId) : null;
  const before = mine ? estArrival(t, mine.idx) : null;
  const destBefore = estArrival(t, t.route.dest.idx);
  t.rt.sim.hold += min;
  t.rt.delay.total += min; t.rt.delay.reason = reason;
  t.rt.delay.events.push({ min, reason, time: state.clock });
  log(`${t.name} ${fmt(t.departure)}: تأخير ${minsAr(min)} بسبب ${reason}`, 'alert-triangle', tripAud(t));
  if (mine && before != null) notify('student', { type:'warn', title:'تم تحديث موعد وصول الباص', body:`تأخر الباص نحو ${minsAr(min)} بسبب ${reason}. الموعد المتوقع الآن ${fmt(estArrival(t, mine.idx))} بدلًا من ${fmt(before)}.` });
  notify('admin', { type:'warn', title:`تأخير في ${t.name} ${fmt(t.departure)}`, body:`${reason}. الوصول المتوقع ${fmt(estArrival(t, t.route.dest.idx))} (كان ${fmt(destBefore)}).` });
  notify(drvAud(t), { type:'warn', title:'تم تحديث وقت الرحلة', body:`أُضيف ${minsAr(min)} للتقدير بسبب ${reason}. أُبلغت الطالبات المسجلات تلقائيًا.` });
}

/* Jumps (demo tools): other moving trips advance by the same time */
function syncLastStop(t){
  let last = -1;
  t.route.stops.forEach(s => { if (s.dist <= t.rt.sim.progress + EPS) last = s.idx; });
  t.rt.sim.lastStop = last;
  if (t.rt.sim.progress >= t.route.trafficAt) t.rt.sim.trafficDone = true;
}
function jumpToProgress(t, p){
  const k = t.route.dest.idx;
  const elapsed = Math.max(0, eta(t, k) - etaFrom(t, k, p, 0, 0));
  advanceBy(elapsed, t);
  Object.assign(t.rt.sim, { progress:p, hold:0, dwell:0 });
  syncLastStop(t);
}
function progressForEta(t, k, target){
  let lo = t.rt.sim.progress, hi = t.route.stops[k].dist;
  for (let i = 0; i < 40; i++){ const mid = (lo + hi) / 2; if (etaFrom(t, k, mid, 0, 0) > target) lo = mid; else hi = mid; }
  return hi;
}
function jumpToNextStop(t){
  const n = nextStopIdx(t);
  if (n < 0) return false;
  advanceBy(eta(t, n), t);
  Object.assign(t.rt.sim, { progress:t.route.stops[n].dist, hold:0, dwell:0 });
  if (t.rt.sim.progress >= t.route.trafficAt) t.rt.sim.trafficDone = true;
  arriveAt(t, n);
  return true;
}

/* ---------- Main loop ---------- */
let lastT = performance.now(), lastSig = '';
function frame(now){
  const dt = Math.min(0.25, (now - lastT) / 1000);
  lastT = now;
  if (anyRunning()){
    advance(dt * BASE_RATE * state.speed);
    if (sig() !== lastSig) render(); else { updateLive(); save(); }
  }
  requestAnimationFrame(frame);
}
function sig(){
  const parts = [state.role, state.notifications.length, studentStatus(), myDelay()];
  TRIPS.forEach(t => {
    const r = t.rt;
    if (r.status === 'in_progress' || r.status === 'paused')
      parts.push(t.id, r.status, r.sim.running, r.sim.lastStop, nextStopIdx(t), r.sim.hold > 0, r.sim.dwell > 0, tripRecord(t).status);
  });
  return parts.join('|');
}

/* =========================================================
   Reservation service (the only place reservations change)
   ========================================================= */
function bookingBlocker(t){
  if (!t) return { type:'error', title:'تعذّر الحجز', body:'الرحلة غير موجودة.' };
  if (t.campusId !== state.campusId) return { type:'error', title:'تعذّر الحجز', body:'الرحلة لا تتبع المقر الجامعي المختار.' };
  const cur = myRes();
  if (!cur && myActiveRequest()) return { type:'info', title:'لديك طلب استلام قيد المعالجة', body:'ألغي طلب الاستلام من المنزل أولًا، أو انتظري تعيين المركبة.' };
  if (cur && cur.tripId === t.id) return { type:'info', title:'أنتِ محجوزة في هذه الرحلة', body:'لا يمكن حجز الرحلة نفسها مرتين.' };
  if (t.rt.status !== 'scheduled') return { type:'warn', title:'أُغلق الحجز', body:'يُغلق الحجز عند انطلاق الرحلة.' };
  if (seatsLeft(t) <= 0) return { type:'warn', title:'الرحلة مكتملة العدد', body:'اختاري رحلة أخرى لهذا المقر.' };
  if (cur){
    const ct = TRIP_BY_ID[cur.tripId];
    if (ct.rt.status !== 'scheduled' || cur.boarded) return { type:'warn', title:'لديك رحلة جارية', body:'يمكنك حجز رحلة جديدة بعد انتهاء رحلتك الحالية.' };
  }
  return null;
}
function createReservation(t, stopId){
  const block = bookingBlocker(t);
  if (block){ toastMsg(block.type, block.title, block.body); return null; }
  const stop = stopOf(t, stopId);
  if (!stop || stop.destination){ toastMsg('error', 'نقطة الالتقاء غير صالحة', 'اختاري محطة من محطات هذه الرحلة.'); return null; }
  const prev = myRes();
  if (prev) cancelReservation(prev, { replacedBy:t });
  const r = { id:'R-' + (++state.seq), studentId:ME, tripId:t.id, campusId:t.campusId, stopId:stop.id, status:'active',
    createdAt:state.clock, boarded:false, boardedAt:null, cancelledAt:null, flags:{ n5:false, n2:false, arrived:false } };
  state.reservations.push(r);
  notify('student', { type:'success', title: prev ? 'تم استبدال حجزك بنجاح' : 'تم تأكيد حجزك بنجاح', body:`${prev ? `أُلغي حجز ${tripLabel(TRIP_BY_ID[prev.tripId])}. ` : ''}${t.name}، الانطلاق ${fmt(t.departure)}. نقطة الالتقاء ${stop.short}، ويصل الباص إليها نحو ${fmt(estArrival(t, stop.idx))}.` });
  notify(drvAud(t), { type:'info', title:'حجز جديد', body:`حجزت ${me().name} في ${t.name} (${fmt(t.departure)})، محطة ${stop.short}.` });
  log(`حجزتِ ${t.name} (${fmt(t.departure)})`, 'user-check', ['student']);
  log(`حجزت ${me().name} في ${t.name} ${fmt(t.departure)}`, 'user-check', ['admin', drvAud(t)]);
  return r;
}
function cancelReservation(r, opts={}){
  const t = TRIP_BY_ID[r.tripId], stop = stopOf(t, r.stopId);
  r.status = 'cancelled'; r.cancelledAt = state.clock; r.flags = { n5:false, n2:false, arrived:false };
  onReservationCancelled(r);
  notify(drvAud(t), { type:'cancel', title:'إلغاء حجز', body:`ألغت ${me().name} حجزها في ${t.name} (${fmt(t.departure)})، محطة ${stop.short}.` });
  log(`ألغت ${me().name} حجزها في ${t.name} ${fmt(t.departure)}`, 'calendar-x', ['admin', drvAud(t)]);
  if (opts.replacedBy){
    log(`استبدلتِ حجز ${t.name} ${fmt(t.departure)}`, 'repeat', ['student']);
  } else {
    notify('student', { type:'cancel', title:'تم إلغاء حجزك', body:`أُلغي حجزك في ${t.name} (${fmt(t.departure)}) وحُرّر مقعدك.` });
    log(`ألغيتِ حجز ${t.name} ${fmt(t.departure)}`, 'calendar-x', ['student']);
  }
}

      confirmText:'إنهاء الرحلة', tone:'error', icon:'flag',

      onConfirm(){
        state.rt[t.id] = freshRuntime();
        bookedRes(t).forEach(r => { r.status = 'active'; r.boarded = false; r.boardedAt = null; r.flags = { n5:false, n2:false, arrived:false }; });
        // keep the "one active reservation per student" rule after restoring
        const actives = bookedRes(t).filter(r => r.studentId === ME);
        if (actives.length && state.reservations.some(r => r.studentId === ME && r.status === 'active' && r.tripId !== t.id)) actives.forEach(r => r.status = 'cancelled');
        if (state.clock > t.departure) state.clock = Math.max(6*60 + 25, t.departure - 10);
        log(`أُعيدت ${t.name} ${fmt(t.departure)} إلى حالتها الأولى (أدوات العرض)`, 'rotate-ccw', tripAud(t));
        ui.toolsOpen = false;
      }
    });
  },
  resetAll(){
    confirmDialog({
      title:'إعادة ضبط جميع بيانات العرض؟', body:'تُحذف الحجوزات والتنبيهات والمحادثات وتعود المنصة إلى حالتها الأصلية.',
      confirmText:'إعادة الضبط', tone:'error', icon:'trash-2',
      onConfirm(){
        try { localStorage.removeItem(STORE_KEY); } catch(e){}
        const speed = state.speed;
        state = initialState(); state.speed = speed;
        hydrateDynamicTrips(); ui.req = null; ui.dsimResult = null;
        ui.toolsOpen = false;
        toastMsg('info', 'أُعيد ضبط بيانات العرض', 'عادت المنصة إلى حالتها الأصلية.');
      }
    });
  },

  /* ---- Modal ---- */
  modalConfirm(el){
    const m = ui.modal; if (!m || m.busy) return;
    const root = document.querySelector('#modalRoot .modal');
    const vals = {}; root?.querySelectorAll('input:checked').forEach(i => vals[i.name] = i.value);
    const finish = () => { ui.modal = null; renderModal(); m.onConfirm?.(vals); render(); };
    if (m.loading){
      m.busy = true; el.disabled = true;
      el.innerHTML = '<span class="spinner"></span> جارٍ التأكيد…';
      setTimeout(finish, 500);
    } else finish();
  },
  modalCancel(){ if (ui.modal?.busy) return; ui.modal = null; renderModal(); },

  /* ---- Assistant ---- */
  ask(){ const inp = document.getElementById('askInput'); if (inp) askAssistant(inp.value); },
  suggest(el){ if (state.role === 'student') state.page.student = 'assistant'; askAssistant(el.dataset.q); }
};

function heroHTML(r, t){
  const s = stopOf(t, r.stopId), st = studentStatus(), meta = STATUS[st];
  const toUni = st === 'onboard' || st === 'passed';
  const k = toUni ? t.route.dest.idx : s.idx;
  const delay = delayAt(t, k);
  const live = isMoving(t);
  let etaBlock;
  if (st === 'ended') etaBlock = `<div class="eta-label">انتهت الرحلة الساعة</div><div class="eta-big num">${fmt(t.rt.endedAt)}</div>`;
  else if (st === 'arrived') etaBlock = `<div class="eta-label">الباص في نقطة الالتقاء الآن</div><div class="eta-big">توجّهي للصعود</div><div class="countdown">${esc(s.short)}، ${esc(s.place)}</div>`;
  else etaBlock = `<div class="eta-label">${toUni ? `الوصول المتوقع إلى ${t.campus.name}` : 'وصول الباص المتوقع إلى نقطتك'}${t.rt.status==='scheduled'?' (حسب الجدول)':''}</div>

  return `<section class="hero" aria-label="حالة رحلتي">
    <div class="hero-title">${ic('graduation-cap','ic-sm')}<b>${t.campus.name}</b><span>انطلاق ${fmt(t.departure)}، ${t.period}، ${t.bus}</span></div>

        <div class="hm"><span>المقر الجامعي</span><b>${t.campus.short}</b></div>
        <div class="hm"><span>نقطة الالتقاء</span><b>${s.short}</b></div>

      </div>

  </section>`;

      ${mine ? '<span class="badge tone-teal plain">رحلتك</span>' : ''}
    </button>`;
  }).join('')}</div>`;
}

function tripsList(){
  const c = CAMPUS_BY_ID[state.campusId], list = tripsForCampus(c.id);
  if (!list.length) return `<div class="card empty" style="margin-top:14px">${ic('calendar-off')}<b>لا توجد رحلات متاحة لهذا المقر حاليًا.</b>لم تُضف رحلات إلى ${c.name} بعد. اختاري مقرًا آخر، أو تواصلي مع مسؤول النقل.</div>`;
  return `<div class="trips-head"><h3>الرحلات إلى ${c.name}</h3><span class="muted small">${tripsAr(list.length)} اليوم</span></div>
    <div class="trip-grid">${list.map(tripCard).join('')}</div>`;

function tripCard(t){
  const booked = bookedRes(t).length, left = seatsLeft(t), r = myRes(), mine = r && r.tripId === t.id, st = t.rt.status;
  const block = bookingBlocker(t);
  let badge, btn;
  if (mine){ badge = '<span class="badge tone-teal">محجوزة لكِ</span>'; btn = `<button class="btn btn-ghost" disabled>${ic('check','ic-sm')} محجوزة لكِ</button>`; }
  else if (st === 'completed'){ badge = '<span class="badge tone-success">انتهت</span>'; btn = `<button class="btn btn-ghost" disabled>انتهت الرحلة</button>`; }
  else if (st !== 'scheduled'){ badge = '<span class="badge tone-navy">انطلقت</span>'; btn = `<button class="btn btn-ghost" disabled>أُغلق الحجز</button>`; }
  else if (left === 0){ badge = '<span class="badge tone-error">مكتملة العدد</span>'; btn = `<button class="btn btn-ghost" disabled>لا توجد مقاعد</button>`; }
  else if (block){ badge = '<span class="badge tone-success">متاحة</span>'; btn = `<button class="btn btn-ghost" disabled title="${esc(block.body)}">${esc(block.title)}</button>`; }
  else { badge = '<span class="badge tone-success">متاحة للحجز</span>'; btn = `<button class="btn btn-teal" data-action="book" data-trip="${t.id}">${ic('calendar-plus','ic-sm')} ${r ? 'استبدال حجزي بهذه الرحلة' : 'احجزي هذه الرحلة'}</button>`; }
  const pct = Math.round(booked / t.capacity * 100);
  const pickups = t.route.stops.length - 1;
  return `<article class="trip-card ${mine?'booked':''}" aria-label="${tripLabel(t)}">
    <div class="tc-top"><div><div class="tc-time num">${fmt(t.departure)}</div><div class="tc-dest">${t.period}</div></div>${badge}</div>
    <div class="tc-rows">
      <div>${ic('graduation-cap','ic-sm')}<span>الوجهة <b>${t.campus.name}</b></span></div>
      <div>${ic('map-pin','ic-sm')}<span>الانطلاق من <b>${t.meetingPoint}</b>، ويمر بـ${stopsAr(pickups)}</span></div>
      <div>${ic('flag','ic-sm')}<span>الوصول ${st==='scheduled'?'المجدول':'المتوقع'} <b class="num">${fmt(st==='completed' ? tripRecord(t).estimated : (estArrival(t, t.route.dest.idx) ?? tripRecord(t).estimated))}</b></span></div>
      <div>${ic('bus','ic-sm')}<span>${t.bus}، الكابتن ${DRIVER_BY_ID[t.driverId].short}</span></div>
    </div>
    <div>
      <div class="seat-bar ${left<=3?'low':''}" role="img" aria-label="${booked} من ${t.capacity} مقعد محجوز"><i style="width:${pct}%"></i></div>
      <div class="seat-txt"><span>${seatsAr(left)}</span><span class="num muted">${booked}/${t.capacity}</span></div>
    </div>
    ${btn}
    ${tripHint(t)}
  </article>`;
}

function reviewHTML(t, stops, def, cur){

  return `${ct ? `<div class="notice tone-warn" style="margin-bottom:14px">${ic('repeat','ic-sm')}<div>لديك حجز مؤكد في ${tripLabel(ct)}. سيُلغى ويُحرَّر مقعده عند تأكيد الحجز الجديد.</div></div>` : ''}
  <div class="kv review">
    <div class="k">${ic('graduation-cap','ic-sm')}الوجهة</div><div class="v">${t.campus.name}</div>
    <div class="k">${ic('calendar','ic-sm')}الرحلة</div><div class="v">${t.period}</div>
    <div class="k">${ic('clock','ic-sm')}الانطلاق</div><div class="v num">${fmt(t.departure)}</div>
    <div class="k">${ic('flag','ic-sm')}الوصول المجدول</div><div class="v num">${fmt(t.arrivalTime)}</div>
    <div class="k">${ic('bus','ic-sm')}الحافلة</div><div class="v">${t.bus}، الكابتن ${DRIVER_BY_ID[t.driverId].short}</div>

  </div>
  <fieldset class="stop-field"><legend>اختاري نقطة الالتقاء</legend>
    <div class="stop-opts">${stops.map(s => `<label class="stop-opt"><input type="radio" name="stop" value="${s.id}" ${s.id===def?'checked':''}><span><b>${s.short}</b><span class="muted small">${s.place}، يمر الباص نحو ${fmt(scheduledArrival(t, s.idx))}</span></span></label>`).join('')}</div>
  </fieldset>
  <p class="muted small" style="margin-top:10px">${ic('info','ic-sm')} المواعيد والمقاعد بيانات تجريبية لأغراض العرض.</p>`;
}

function notesCard(){
  const list = myNotes().slice(0,4);
  return `<section class="card notes-card" aria-labelledby="notesTitle">
    <div class="card-head" style="padding:18px 20px 0"><h3 id="notesTitle">${ic('bell')}الإشعارات</h3><button class="link-btn" data-action="go" data-page="notifications">عرض الكل</button></div>

function historyCard(){

    <div class="card-head"><h3 id="histTitle">${ic('history')}سجل الرحلات</h3><span class="muted small">اليوم</span></div>
    ${list.length ? `<ul class="feed">${list.map(r => { const t = TRIP_BY_ID[r.tripId], [l, tone] = RES_STATUS[r.status];
      return `<li><span class="fi">${ic(r.status==='cancelled'?'calendar-x':r.status==='missed'?'user-x':'flag','ic-sm')}</span><span class="ft"><b>${tripLabel(t)}</b><br><span class="muted small">محطة ${stopOf(t, r.stopId).short}</span></span><span class="badge ${tone}">${l}</span></li>`; }).join('')}</ul>`
      : `<div class="empty">${ic('history')}<b>لا توجد رحلات سابقة بعد</b>تظهر هنا الحجوزات المكتملة والملغاة.</div>`}

function assistantTeaser(){
  return `<section class="card ask-card">
    <span class="ai-mark">${ic('sparkles')}</span>
    <div style="flex:1;min-width:180px"><b>اسألي مساعد وصّال</b><div class="muted small">إجابات فورية من حالة رحلتك الحالية.</div></div>
    <div class="chips">${['متى يوصل الباص؟','هل الباص تأخر؟','كم باقي على وصول الباص؟'].map(q => `<button class="chip" data-action="suggest" data-q="${q}">${q}</button>`).join('')}</div>
  </section>`;

/* ---------- Map (custom SVG; no external tiles) ---------- */
function mapSVG(t, mineIdx){
  const R = t.route, pts = R.points.map(p => p.join(',')).join(' ');
  const [bx,by] = pointAt(R, t.rt.sim.progress);
  const started = t.rt.status !== 'scheduled';
  const road = d => `<path d="${d}" fill="none" stroke="var(--map-edge)" stroke-width="20" stroke-linecap="round"/><path d="${d}" fill="none" stroke="var(--map-road)" stroke-width="15" stroke-linecap="round"/>`;
  const others = CAMPUSES.filter(c => c.x != null && c.id !== t.campusId).map(c =>
    `<g transform="translate(${c.x},${c.y})" opacity=".75"><rect x="-9" y="-9" width="18" height="18" rx="5" fill="var(--surface)" stroke="var(--faint)" stroke-width="2"/><text class="campus-faint" x="${c.lbl[0]}" y="${c.lbl[1] + (c.lbl[1] < 0 ? 6 : 0)}" text-anchor="middle">${c.name}</text></g>`).join('');
  return `<svg class="map-svg" viewBox="0 0 1000 640" role="img" aria-label="مخطط توضيحي لمسار ${R.name} التجريبي، مع المحطات وموقع الباص الحالي">
  <defs>
    <pattern id="blocks" width="46" height="46" patternUnits="userSpaceOnUse"><rect x="4" y="4" width="38" height="38" rx="7" fill="var(--map-block)"/></pattern>
    <marker id="chev" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M2.5 1.5 L7 5 L2.5 8.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1000" height="640" fill="var(--map-bg)"/>
  <rect width="1000" height="640" fill="url(#blocks)" opacity=".7"/>
  <path d="M600 600 q40 -70 150 -40 q70 25 30 70 q-30 30 -120 20 q-50 -8 -60 -50z" fill="var(--map-park)"/>
  <path d="M40 470 q60 -50 130 -10 q40 40 -20 75 q-70 30 -110 -65z" fill="var(--map-park)"/>
  <path d="M700 120 q60 -40 110 0 q30 40 -30 60 q-60 20 -80 -60z" fill="var(--map-park)"/>
  ${road('M-20 300 C 200 330 450 420 1020 380')}
  ${road('M560 -20 C 540 200 610 420 520 660')}
  ${road('M60 660 C 220 420 420 210 660 -20')}
  ${road('M-20 560 C 300 520 640 600 1020 590')}
  ${road('M760 -20 C 800 200 900 380 1020 470')}
  ${t.dynamic ? networkLines(.8) : ''}
  ${others}
  <polyline points="${pts}" fill="none" stroke="var(--navy)" stroke-opacity=".14" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="${pts}" fill="none" stroke="var(--teal)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" marker-mid="url(#chev)"/>
  <polyline class="js-traveled" data-trip="${t.id}" points="${pts}" fill="none" stroke="var(--route-done)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="0 ${R.length.toFixed(1)}"/>
  ${R.stops.map(s => {
    const [x,y] = R.points[s.pi], passed = started && t.rt.sim.progress >= s.dist - EPS;
    const [lx, ly] = s.lbl;
    let mark;
    if (s.idx === mineIdx) mark = `<circle r="25" fill="var(--brass)" opacity=".22"/><circle r="13" fill="var(--brass)" stroke="#fff" stroke-width="4"/>`;
    else if (s.destination) mark = `<rect x="-15" y="-15" width="30" height="30" rx="8" fill="var(--navy)" stroke="#fff" stroke-width="3"/><path d="M-5 7 V-7 M-5 -7 H6 L3 -3 L6 1 H-5" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>`;
    else mark = `<circle r="10" fill="${passed?'var(--route-done)':'var(--surface)'}" stroke="var(--navy)" stroke-width="3.5"/>`;
    return `<g transform="translate(${x},${y})">${mark}
      <text class="stop-label" x="${lx}" y="${ly}" text-anchor="middle">${s.short}</text>
      ${s.idx===mineIdx ? `<g transform="translate(${lx},${ly + (ly < 0 ? -28 : 24)})"><rect x="-30" y="-15" width="60" height="24" rx="12" fill="var(--brass)"/><text y="2" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">نقطتك</text></g>` : ''}
    </g>`;
  }).join('')}
  <g class="js-bus" data-trip="${t.id}" transform="translate(${bx.toFixed(1)},${by.toFixed(1)})">
    <circle class="bus-pulse" r="30" fill="var(--navy)"/>
    <circle r="20" fill="var(--bus)" stroke="#fff" stroke-width="3.5"/>
    <g transform="translate(-9.5,-9.5) scale(.8)" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></g>
  </g>
  <g transform="translate(50,600)"><circle r="22" fill="var(--surface)" stroke="var(--line)"/><path d="M0 -14 L6 4 L0 0 L-6 4z" fill="var(--navy)"/><text y="16" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">ش</text></g>
</svg>`;
}

function tripSelect(list, selected, label){
  return `<label class="field-inline"><span class="muted small">${label}</span>
    <select class="select" data-change="pickTrip" aria-label="${label}">${list.map(t => `<option value="${t.id}" ${t===selected?'selected':''}>${tripLabel(t)} (${TRIP_STATUS[tripRecord(t).status][0]})</option>`).join('')}</select></label>`;
}

/* ---------- Tracking ---------- */
function trackingView(){
  const role = state.role, isStudent = role === 'student';
  const t = isStudent ? myTrip() : role === 'driver' ? driverTrip() : adminTrip();
  if (!t){
    return `<div class="page-head"><div><h1>تتبع الحافلة</h1><p>${isStudent ? 'تتبعي الباص الخاص برحلتك المحجوزة.' : 'لا توجد رحلات مسندة لهذا السائق.'}</p></div></div>
      <div class="card empty">${ic('map-pinned')}<b>${isStudent ? 'لم تحجزي أي رحلة حتى الآن.' : 'لا توجد رحلة لعرضها'}</b>${isStudent ? 'بعد حجز رحلة سيظهر هنا موقع الباص ومحطاته ووقت وصوله إلى نقطتك.' : ''}
      ${isStudent ? `<div style="margin-top:14px"><button class="btn btn-teal" data-action="scrollBook">${ic('calendar-plus','ic-sm')} احجزي رحلة</button></div>` : ''}</div>`;
  }
  const st = t.rt.status, sim = t.rt.sim, n = nextStopIdx(t);
  const r = isStudent ? myRes() : null;
  const mineIdx = r ? stopOf(t, r.stopId).idx : -1;
  const sStat = isStudent ? studentStatus() : null;
  const target = isStudent && sStat !== 'onboard' && sStat !== 'passed' ? t.route.stops[mineIdx] : (n >= 0 ? t.route.stops[n] : t.route.dest);
  const targetLabel = target.idx === mineIdx ? 'الوصول المتوقع إلى نقطتك' : `الوصول المتوقع إلى ${target.short}`;
  const runLabel = sim.running ? 'إيقاف مؤقت' : (sim.progress > 0 || st === 'paused' ? 'استئناف المحاكاة' : 'تشغيل المحاكاة');
  const canRun = tripActive(t) && !atDestination(t);
  const bs = busStatus(t);
  const list = role === 'driver' ? driverTrips(state.driverId) : TRIPS.slice().sort(byDeparture);

  let notice = '';
  if (st === 'scheduled') notice = `<div class="notice tone-navy">${ic('info','ic-sm')}<div>لم تبدأ الرحلة بعد. يبدأها السائق من لوحة الرحلة، ثم تُشغَّل حركة الباص من هنا.${role!=='driver'
    ? `<div style="margin-top:8px"><button class="btn btn-primary btn-sm" data-action="role" data-role="driver">${ic('bus','ic-sm')} الانتقال إلى لوحة السائق</button></div>`
    : `<div style="margin-top:8px"><button class="btn btn-primary btn-sm" data-action="startTrip" data-trip="${t.id}">${ic('play','ic-sm')} بدء الرحلة</button></div>`}</div></div>`;
  else if (st === 'completed') notice = `<div class="notice tone-success">${ic('flag','ic-sm')}<div>انتهت الرحلة الساعة ${fmt(t.rt.endedAt)}. يمكن استعادة حالتها الأولى من أدوات العرض.</div></div>`;
  else if (atDestination(t)) notice = `<div class="notice tone-success">${ic('flag','ic-sm')}<div>وصل الباص إلى ${t.campus.name}. يُنهي السائق الرحلة من لوحته.</div></div>`;

  const stopsList = t.route.stops.map(s => {
    const passed = st !== 'scheduled' && sim.progress >= s.dist - EPS;
    const current = dwellingAt(t) === s.idx || (!passed && s.idx === n && st !== 'scheduled' && st !== 'completed');
    const isMine = s.idx === mineIdx;
    const c = bookedRes(t).filter(x => x.stopId === s.id).length, bc = boardedRes(t).filter(x => x.stopId === s.id).length;
    const right = passed ? `<span class="muted">${dwellingAt(t)===s.idx ? 'الباص هنا' : 'تم المرور'}</span>`
      : st === 'completed' ? '<span class="muted">—</span>' : `<b class="num" data-live="eta" data-trip="${t.id}" data-k="${s.idx}">—</b><span class="muted small">${st==='scheduled'?'مجدول':'متوقع'}</span>`;
    return `<li class="${passed?'passed':''} ${current?'current':''} ${isMine?'mine':''}">
      <span class="sd">${passed ? '✓' : s.destination ? ic('flag','ic-sm') : s.idx+1}</span>
      <div><div class="sn">${s.short}${isMine?'<span class="badge tone-teal plain">نقطتك</span>':''}</div>
      <div class="sp">${s.place}${!s.destination ? `، ${isStudent ? registeredAr(c) : `صعدت ${bc} من ${c}`}` : ''}</div></div>
      <div class="st">${right}</div></li>`;
  }).join('');

  return `<div class="page-head"><div><h1>تتبع الحافلة</h1><p>${tripLabel(t)}، ${t.bus}، مسار ${t.route.name}</p></div>
    <div class="head-tools">${!isStudent ? tripSelect(list, t, 'الرحلة') : ''}<span class="sim-chip">${ic('flask-conical','ic-sm')} مسار وحركة تجريبيان، لا يوجد GPS حقيقي</span></div></div>
  <div class="track-grid">
    <section class="map-card" aria-label="الخريطة">
      ${mapSVG(t, mineIdx)}
      <div class="map-overlay">
        <div class="mo-status"><span class="badge tone-${bs.tone} plain">${ic(bs.icon,'ic-sm')}</span><span data-live="status" data-trip="${t.id}">—</span></div>
        <div class="mo-eta num" data-live="eta" data-trip="${t.id}" data-k="${target.idx}">—</div>
        <div class="mo-sub">${targetLabel}${st==='scheduled'?' (حسب الجدول)':''}، متبقٍ <span class="num" data-live="countdown" data-trip="${t.id}" data-k="${target.idx}">—</span> دقيقة</div>
      </div>
      <div class="map-foot"><span>${ic('info','ic-sm')} مخطط توضيحي لمسار تجريبي في منطقة مكة المكرمة، ليس بمقياس رسم</span><span>${ic('satellite','ic-sm')} مصدر الموقع: ${VehicleFeed.label(t.id)}، آخر تحديث <b class="num" data-live="clock">${fmt(state.clock)}</b></span></div>
    </section>
    <aside class="stack">
      <section class="card controls" aria-label="التحكم في المحاكاة">
        <div class="card-head" style="margin-bottom:4px"><h3>${ic('gauge')}محاكاة الحركة</h3><span class="badge ${sim.running?'tone-teal':''}">${sim.running?'تعمل':'متوقفة'}</span></div>
        ${notice}
        <div class="ctrl-row"><button class="btn ${sim.running?'btn-ghost':'btn-teal'}" data-action="${sim.running?'simPause':'simStart'}" data-trip="${t.id}" ${canRun?'':'disabled'}>${ic(sim.running?'pause':'play','ic-sm')} ${runLabel}</button></div>
        <div class="ctrl-row">
          <button class="btn btn-ghost btn-sm" data-action="nextStop" data-trip="${t.id}" ${canRun?'':'disabled'}>${ic('skip-back','ic-sm')} المحطة التالية</button>
          <button class="btn btn-ghost btn-sm" data-action="simReset" data-trip="${t.id}" ${tripActive(t)?'':'disabled'}>${ic('rotate-ccw','ic-sm')} إعادة المحاكاة</button>
        </div>
        <div><div class="muted small" style="margin-bottom:6px">سرعة المحاكاة</div>${speedSeg()}</div>
      </section>
      <section class="card" aria-label="المحطات">
        <div class="card-head"><h3>${ic('list')}المحطات</h3><span class="muted small">${stopsAr(t.route.stops.length - 1)} و${t.campus.short}</span></div>
        <ol class="stops">${stopsList}</ol>
      </section>
    </aside>
  </div>`;
}
function speedSeg(){
  return `<div class="seg" role="group" aria-label="سرعة المحاكاة">${[0.5,1,2,4].map(v => `<button data-action="speed" data-speed="${v}" aria-pressed="${state.speed===v}">${v}×</button>`).join('')}</div>`;
}

/* ---------- Driver ---------- */
function driverView(){
  const d = DRIVER_BY_ID[state.driverId], trips = driverTrips(d.id), t = driverTrip();
  const head = `<div class="page-head"><div><h1>مرحبًا، كابتن ${d.short}</h1><p>${t ? `${t.name}، ${t.period}` : 'لا توجد رحلات مسندة اليوم'}</p></div>
    <div class="head-tools"><label class="field-inline"><span class="muted small">عرض بصفة السائق (للعرض)</span>
      <select class="select" data-change="setDriver" aria-label="اختيار السائق">${DRIVERS.map(x => `<option value="${x.id}" ${x.id===d.id?'selected':''}>${x.name}</option>`).join('')}</select></label></div></div>`;
  if (!t) return head + `<div class="card empty">${ic('calendar-off')}<b>لا توجد رحلات مسندة لهذا السائق اليوم</b>تظهر الرحلات هنا عند إسنادها من مسؤول النقل.</div>`;

  const tabs = `<div class="trip-tabs" role="group" aria-label="رحلاتي اليوم">${trips.map(x => { const rec = tripRecord(x), [sl, tone] = TRIP_STATUS[rec.status];
    return `<button class="trip-tab" data-action="pickTrip" data-trip="${x.id}" aria-pressed="${x===t}"><b class="num">${fmt(x.departure)}</b><span>${x.campus.name}</span><span class="tt-meta"><span class="badge ${tone}">${sl}</span><span class="muted small">${registeredAr(rec.registered)}</span></span></button>`; }).join('')}</div>`;

  const st = t.rt.status, rec = tripRecord(t), res = bookedRes(t), b = boardedRes(t).length;
  const [sl, tone] = TRIP_STATUS[rec.status];
  const bs = busStatus(t);
  const order = s => t.route.stops.findIndex(x => x.id === s);
  const rows = res.slice().sort((a,b2) => order(a.stopId) - order(b2.stopId)).map(r => {
    const s = STUDENT_BY_ID[r.studentId], stop = stopOf(t, r.stopId);
    const reached = tripActive(t) && t.rt.sim.progress >= stop.dist - EPS;
    let action;
    if (r.boarded) action = `<span class="done-tag">${ic('check','ic-sm')} ${fmt(r.boardedAt)}</span>`;
    else if (r.status === 'missed') action = '<span class="muted small">لم تصعد</span>';
    else if (!tripActive(t)) action = `<button class="btn btn-ghost btn-sm" disabled>تأكيد الصعود</button>`;
    else if (!reached) action = `<button class="btn btn-ghost btn-sm" disabled title="بانتظار وصول الباص للمحطة">بانتظار الباص</button>`;
    else action = `<button class="btn btn-teal btn-sm" data-action="board" data-res="${r.id}" aria-label="تأكيد صعود ${s.name}">${ic('user-check','ic-sm')} تأكيد الصعود</button> <button class="btn btn-ghost btn-sm" data-action="missPickup" data-res="${r.id}" aria-label="تسجيل عدم حضور ${s.name}">${ic('user-x','ic-sm')} لم تحضر</button>`;
    const [rl, rtone] = RES_STATUS[r.status];
    return `<tr class="${r.studentId===ME?'me':''}">
      <td><span class="who"><span class="avatar">${s.name[0]}</span>${s.name}</span></td>
      <td>${stop.short}</td>
      <td><span class="badge ${rtone}">${rl}</span></td>
      <td>${r.boarded ? '<span class="badge tone-teal">صعدت</span>' : '<span class="badge tone-warn">لم تصعد</span>'}</td>
      <td>${action}</td></tr>`;
  }).join('');
  const stopRows = t.route.stops.filter(s => !s.destination).map(s => {
    const c = res.filter(x => x.stopId === s.id).length, bc = res.filter(x => x.stopId === s.id && x.boarded).length;
    const passed = st !== 'scheduled' && t.rt.sim.progress >= s.dist - EPS, here = dwellingAt(t) === s.idx, next = !passed && nextStopIdx(t) === s.idx && tripActive(t);
    const badge = here ? '<span class="badge tone-teal">الباص هنا</span>' : passed ? '<span class="badge tone-success">تم</span>' : next ? '<span class="badge tone-navy">التالية</span>' : '<span class="badge plain">قادمة</span>';
    return `<li class="${passed?'passed':''} ${here||next?'current':''}"><span class="sd">${passed?'✓':s.idx+1}</span>
      <div><div class="sn">${s.short}</div><div class="sp">${s.place}، يمر نحو <span class="num">${fmt(scheduledArrival(t, s.idx))}</span></div></div>
      <div class="st"><b class="num">${bc}/${c}</b>${badge}</div></li>`;
  }).join('');

  return head + tabs + `
  <div class="trip-facts">
    <span>${ic('graduation-cap','ic-sm')} الوجهة <b>${t.campus.name}</b></span>
    <span>${ic('clock','ic-sm')} الانطلاق <b class="num">${fmt(t.departure)}</b></span>
    <span>${ic('map-pin','ic-sm')} من <b>${t.meetingPoint}</b> عبر ${stopsAr(t.route.stops.length-1)}</span>
    <span>${ic('flag','ic-sm')} الوصول المجدول <b class="num">${fmt(t.arrivalTime)}</b></span>
    <span>${ic('bus','ic-sm')} <b>${t.bus}</b></span>
  </div>
  <div class="stats five">
    <div class="stat"><span class="sl">${ic('users','ic-sm')}حجوزات مؤكدة</span><span class="sv num">${res.length}</span></div>
    <div class="stat"><span class="sl">${ic('user-check','ic-sm')}صعدن</span><span class="sv num">${b}</span></div>
    <div class="stat"><span class="sl">${ic('user','ic-sm')}المتبقيات</span><span class="sv num">${res.length - b}</span></div>
    <div class="stat"><span class="sl">${ic('armchair','ic-sm')}مقاعد شاغرة</span><span class="sv num">${seatsLeft(t)}<small class="muted" style="font-size:14px"> / ${t.capacity}</small></span></div>
    <div class="stat accent"><span class="sl">${ic('bus','ic-sm')}حالة الرحلة</span><span class="sv txt">${sl}</span></div>
  </div>
  <div class="driver-bar">
    <div class="now"><span class="ai">${ic(bs.icon)}</span><div><b data-live="status" data-trip="${t.id}">—</b><span>${st==='scheduled' ? `الانطلاق المجدول ${fmt(t.departure)} من ${t.meetingPoint}` : st==='completed' ? `انتهت الساعة ${fmt(t.rt.endedAt)}` : `الوصول المتوقع إلى ${t.campus.short} <span class="num" data-live="eta" data-trip="${t.id}">—</span>`}</span></div></div>
    <div class="btns">
      ${st==='scheduled' ? `<button class="btn btn-primary" data-action="startTrip" data-trip="${t.id}">${ic('play','ic-sm')} بدء الرحلة</button>` : ''}
      ${st==='in_progress' ? `<button class="btn btn-ghost" data-action="pauseTrip" data-trip="${t.id}">${ic('pause','ic-sm')} إيقاف مؤقت</button>` : ''}
      ${st==='paused' ? `<button class="btn btn-teal" data-action="resumeTrip" data-trip="${t.id}">${ic('play','ic-sm')} استئناف الرحلة</button>` : ''}
      ${st==='in_progress' && !t.rt.sim.running && !atDestination(t) ? `<button class="btn btn-teal" data-action="simStart" data-trip="${t.id}">${ic('navigation','ic-sm')} تشغيل حركة الباص</button>` : ''}
      ${tripActive(t) ? `<button class="btn btn-danger" data-action="endTrip" data-trip="${t.id}">${ic('flag','ic-sm')} إنهاء الرحلة</button>` : ''}
    </div>
  </div>
  ${driverOpsCard(t)}
  <div class="grid-2">
    <section class="card" aria-labelledby="manTitle">
      <div class="card-head"><h3 id="manTitle">${ic('list-checks')}طالبات هذه الرحلة</h3><span class="muted small">${registeredAr(res.length)}</span></div>
      ${res.length ? `<div class="table-wrap"><table><thead><tr><th>الطالبة</th><th>نقطة الالتقاء</th><th>الحجز</th><th>الصعود</th><th>إجراء</th></tr></thead><tbody>${rows}</tbody></table></div>`
        : `<div class="empty">${ic('users')}<b>لا توجد طالبات مسجلات في هذه الرحلة</b>تظهر الطالبات هنا فور حجزهن لهذه الرحلة.</div>`}
    </section>
    <section class="card" aria-labelledby="stopTitle">
      <div class="card-head"><h3 id="stopTitle">${ic('map-pin')}محطات الالتقاء</h3><span class="muted small">صعدن / مسجلات</span></div>
      <ol class="stops">${stopRows}</ol>
    </section>
  </div>`;
}

    <div class="stat"><span class="sl">${ic('bus','ic-sm')}حافلات نشطة</span><span class="sv num">${active}</span></div>
    <div class="stat"><span class="sl">${ic('alert-triangle','ic-sm')}رحلات متأخرة</span><span class="sv num" style="${delayed?'color:var(--warn)':''}">${delayed}</span></div>
    <div class="stat"><span class="sl">${ic('flag','ic-sm')}رحلات مكتملة</span><span class="sv num">${completed}</span></div>
  </div>
  <section class="card" aria-labelledby="tripsTitle">
    <div class="card-head"><h3 id="tripsTitle">${ic('route')}رحلات اليوم</h3><span class="muted small">مواعيد الوصول إلى المقر</span></div>
    <div class="table-wrap"><table><thead><tr><th>المقر</th><th>الانطلاق</th><th>السائق والحافلة</th><th>الحالة</th><th>صعدن / حجوزات</th><th>الوصول المجدول</th><th>المتوقع</th><th>الفرق</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  </section>
  <div class="admin-grid">
    <section class="card span-2" aria-labelledby="liveTitle">
      <div class="card-head"><h3 id="liveTitle">${ic('map')}${tripLabel(sel)}</h3><span class="badge ${TRIP_STATUS[sr.status][1]}">${TRIP_STATUS[sr.status][0]}</span></div>
      <div class="mini-map"><div class="map-card">${mapSVG(sel, -1)}</div></div>
      <div class="kv" style="margin-top:10px">
        <div class="k">${ic('navigation','ic-sm')}حالة الباص</div><div class="v" data-live="status" data-trip="${sel.id}">—</div>
        <div class="k">${ic('clock','ic-sm')}المجدول مقابل المتوقع</div><div class="v num">${fmt(sr.scheduled)} / <span data-live="est" data-trip="${sel.id}">${fmt(sr.estimated)}</span></div>
        <div class="k">${ic('alert-triangle','ic-sm')}سبب التأخير</div><div class="v">${sel.rt.delay.reason && sel.rt.status !== 'scheduled' ? esc(sel.rt.delay.reason) : 'لا يوجد'}</div>
        <div class="k">${ic('users','ic-sm')}الإشغال</div><div class="v">${sr.registered} من ${sel.capacity} مقعد، صعدت ${sr.boarded}</div>
      </div>
    </section>
    <section class="card" aria-labelledby="feedTitle">
      <div class="card-head"><h3 id="feedTitle">${ic('activity')}نشاط النظام</h3></div>
      <ul class="feed">${feed.map(a => `<li><span class="fi">${ic(a.icon,'ic-sm')}</span><span class="ft">${esc(a.text)}</span><time class="num">${fmt(a.time)}</time></li>`).join('')}</ul>
    </section>
    <section class="card" aria-labelledby="barsTitle">
      <div class="card-head"><h3 id="barsTitle">${ic('bar-chart-3')}الحجوزات حسب المقر</h3></div>
      <div class="bars">${bars}</div>
      <div class="legend"><span><i style="background:color-mix(in srgb,var(--teal) 35%,transparent)"></i>السعة</span><span><i style="background:var(--teal)"></i>محجوز</span></div>
    </section>
    <section class="card" aria-labelledby="pickTitle">
      <div class="card-head"><h3 id="pickTitle">${ic('map-pin')}حسب نقطة الالتقاء</h3><span class="muted small">${sel.campus.short} ${fmt(sel.departure)}</span></div>
      <div class="bars">${pickBars.map(x => `<div class="bar-row"><span>${x.s.short}</span><div class="bar-track"><div class="bar-reg" style="width:${x.r/maxP*100}%"></div><div class="bar-board" style="width:${x.b/maxP*100}%"></div></div><span class="num muted">${x.b}/${x.r}</span></div>`).join('')}</div>
      <div class="legend"><span><i style="background:color-mix(in srgb,var(--teal) 35%,transparent)"></i>محجوزات</span><span><i style="background:var(--teal)"></i>صعدن</span></div>
    </section>
    <section class="card" aria-labelledby="donutTitle">
      <div class="card-head"><h3 id="donutTitle">${ic('pie-chart')}حالات الرحلات</h3></div>
      <div class="donut-wrap">
        <svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="${cats.map(c=>`${c.l} ${c.n}`).join('، ')}"><circle r="44" cx="60" cy="60" fill="none" stroke="var(--surface-2)" stroke-width="16"/>${arcs}<text x="60" y="58" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)">${trips.length}</text><text x="60" y="78" text-anchor="middle" font-size="12" fill="var(--muted)">رحلات</text></svg>
        <div class="legend" style="flex-direction:column;gap:8px;margin:0">${cats.map(c => `<span><i style="background:${c.c}"></i>${c.l}: <b class="num">${c.n}</b></span>`).join('')}</div>
      </div>
    </section>
  </div>`;
}

/* ---------- Modal & toasts ---------- */
function renderModal(){
  const root = document.getElementById('modalRoot'), m = ui.modal;
  if (!m){ root.innerHTML = ''; return; }
  const tone = m.tone === 'error' ? 'tone-error' : 'tone-navy';
  root.innerHTML = `<div class="scrim modal-scrim" data-action="modalCancel"></div>
  <div class="modal ${m.wide?'wide':''}" role="alertdialog" aria-modal="true" aria-labelledby="mTitle" ${m.body?'aria-describedby="mBody"':''}>
    <div class="mi ${tone}">${ic(m.icon || 'help-circle','ic-lg')}</div>
    <h3 id="mTitle">${m.title}</h3>${m.body ? `<p id="mBody">${m.body}</p>` : ''}
    ${m.content ? `<div class="modal-content">${m.content}</div>` : ''}
    <div class="row"><button class="btn ${m.tone==='error'?'btn-danger-solid':'btn-primary'}" data-action="modalConfirm">${m.confirmText}</button><button class="btn btn-ghost" data-action="modalCancel">تراجع</button></div>
  </div>`;
  icons();
  (root.querySelector('input:checked') || root.querySelector('.row .btn-ghost'))?.focus();
}
function toast(n){
  const st = NOTE_STYLE[n.type] || NOTE_STYLE.info;
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<div class="ni ${st.tone}">${ic(st.icon)}</div><div><b>${esc(n.title)}</b><p>${esc(n.body || '')}</p></div><button aria-label="إغلاق التنبيه">${ic('x','ic-sm')}</button>`;
  el.querySelector('button').onclick = () => el.remove();
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  icons();
  setTimeout(() => el.remove(), 5200);
}

/* ---------- Live (per-frame) updates, keyed by trip ---------- */
function updateLive(){
  document.querySelectorAll('[data-live="clock"]').forEach(el => el.textContent = fmt(state.clock));
  document.querySelectorAll('[data-live][data-trip]').forEach(el => {
    const t = TRIP_BY_ID[el.dataset.trip]; if (!t) return;
    const k = el.dataset.k != null ? Number(el.dataset.k) : t.route.dest.idx;
    switch (el.dataset.live){
      case 'eta': {
        const e = estArrival(t, k);
        el.textContent = e != null ? fmt(e) : (t.rt.status === 'completed' ? 'انتهت' : (dwellingAt(t) === k ? 'الباص هنا' : 'تم المرور'));
        break; }

/* =========================================================
   v3 — Emerging-technology prototypes
   1) Demand forecasting (statistical baseline, not ML)
   2) Rule-based decision agent (observe → … → execute)
   3) Digital-twin prototype (network view + what-if scenarios)
   4) Route optimization (exhaustive search in a travel-time model)
   5) Vehicle-feed interface for future GPS/IoT
   All read the same state: TRIPS, state.rt, state.reservations.
   ========================================================= */
const sum = (a, f = x => x) => a.reduce((s, x) => s + f(x), 0);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* ---------- Dynamic capacity: the single source of truth for seats ---------- */
const SPARES = [
  { id:'SP21', name:'حافلة احتياطية 21', seats:15 },
  { id:'SP22', name:'حافلة احتياطية 22', seats:12 }
];
function capacityOf(t, sc){
  let c = state.capOverride && state.capOverride[t.id] != null ? state.capOverride[t.id] : t.baseCapacity;
  c += sum(SPARES.filter(s => state.spares && state.spares[s.id] === t.id), s => s.seats);
  if (sc && sc.tripId === t.id) c = Math.max(0, c - (sc.capRed || 0));
  return c;
}
TRIPS.forEach(t => {
  t.baseCapacity = t.capacity; delete t.capacity;
  Object.defineProperty(t, 'capacity', { get(){ return capacityOf(t); }, configurable:true });
});
const freeSpares = () => SPARES.filter(s => !state.spares || !state.spares[s.id]);

/* ---------- State extension (same store, new fields) ---------- */
initialState = (function(base){
  return function(){
    return Object.assign(base(), {
      v:3, capOverride:{}, spares:{}, demandAdj:{}, redirect:{}, observed:{}, gpsFixes:{},
      agentLog:[], agentDismissed:{}, intelTab:'forecast', fcTrip:null,

/* =========================================================
   1) DEMAND FORECASTING
   Synthetic history (seeded, reproducible) of daily demand per
   recurring trip, Sunday–Thursday, 8 weeks. Demand = bookings +
   unmet requests, so it can exceed capacity.
   ========================================================= */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const DAY_AR = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const DEMAND_PROFILE = { 'T-ZHR-0640':27, 'T-ZHR-0720':13, 'T-ABD-0545':12, 'T-ABD-0700':36, 'T-AZZ-0750':17, 'T-RAI-0810':7, 'T-JMM-0645':12 };
const WEEKDAY_FACTOR = [1.08, 1.02, 1.0, 0.96, 0.80];
const HIST_WEEKS = 8, WMA_WINDOW = 6, Z80 = 1.28;
const HISTORY = (() => {
  const rnd = mulberry32(20261023), h = {};
  TRIPS.forEach(t => {
    const b = DEMAND_PROFILE[t.id] || 10; h[t.id] = [];
    for (let w = 0; w < HIST_WEEKS; w++) for (let d = 0; d < 5; d++){
      const trend = 1 + 0.012 * (w - HIST_WEEKS + 1);
      const noise = (rnd() + rnd() + rnd() - 1.5) * 0.16;
      h[t.id].push({ week:w, day:d, value: Math.max(0, Math.round(b * WEEKDAY_FACTOR[d] * trend * (1 + noise))) });
    }
  });

})();
/* The demo always runs as a study day: Fri/Sat map to Sunday */
const DEMO_DAY = (() => { const g = new Date().getDay(); return g <= 4 ? g : 0; })();
const series = (id, d) => (HISTORY[id] || []).filter(o => o.day === d).map(o => o.value);
function wma(xs){ let s = 0, w = 0; xs.forEach((x,i) => { s += x * (i+1); w += i+1; }); return w ? s / w : 0; }

/* Backtest: one-step-ahead WMA on held-out weeks → residual σ and MAPE */
const BACKTEST = (() => {
  const out = {};
  TRIPS.forEach(t => {
    const errs = [], ape = [];
    for (let d = 0; d < 5; d++){
      const xs = series(t.id, d);
      for (let i = 3; i < xs.length; i++){
        const pred = wma(xs.slice(Math.max(0, i - WMA_WINDOW), i)), e = xs[i] - pred;
        errs.push(e);
        if (i >= xs.length - 2 && xs[i] > 0) ape.push(Math.abs(e) / xs[i]);
      }
    }
    out[t.id] = { sigma: Math.sqrt(sum(errs, e => e*e) / errs.length), mape: sum(ape) / ape.length, n: ape.length };
  });
  out.overall = sum(TRIPS, t => out[t.id].mape) / TRIPS.length;
  return out;
})();

function histForecast(id, d, withToday){
  const xs = series(id, d);
  if (withToday && d === DEMO_DAY && state.observed && state.observed[id] != null) xs.push(state.observed[id]);
  return wma(xs.slice(-WMA_WINDOW));
}
/* Assumed booking curve: share of final bookings made L minutes before departure.

const BOOKING_CURVE = [[0,1],[30,.92],[60,.85],[120,.76],[240,.62],[720,.35],[1440,.12],[2880,0]];
function bookedShare(lead){
  for (let i = 1; i < BOOKING_CURVE.length; i++){
    const [l1,s1] = BOOKING_CURVE[i-1], [l2,s2] = BOOKING_CURVE[i];
    if (lead <= l2) return s1 + (s2 - s1) * (lead - l1) / (l2 - l1);
  }
  return 0;
}
/* Forecast final demand for today's trip t, optionally under scenario sc */
function forecastTrip(t, sc){
  if (t.dynamic) return dynForecast(t);
  const booked = bookedRes(t).length, cap = capacityOf(t, sc), st = t.rt.status;
  const adjBase = 1 + (state.demandAdj[t.campusId] || 0) / 100;
  const adjSc = 1 + (sc && sc.campusId === t.campusId ? sc.demandPct || 0 : 0) / 100;
  const hist = histForecast(t.id, DEMO_DAY, false) * adjBase;
  let share, mean, method;
  if (st === 'completed'){ share = 1; mean = state.observed[t.id] ?? booked; method = 'observed'; }
  else if (st !== 'scheduled'){ share = 1; mean = booked; method = 'boarding'; }
  else {
    share = bookedShare(Math.max(0, t.departure - state.clock));
    const pace = share > 0 ? booked / share : hist;
    mean = share * pace + (1 - share) * hist;
    method = 'blend';
  }
  const censored = st === 'scheduled' && booked >= 0.9 * t.capacity;   // bookings capped by seats
  if (censored) mean = Math.max(mean, hist);

  const level = st !== 'scheduled' ? 'done' : mean > cap + 0.5 ? 'over' : hi > cap ? 'risk' : mean < 0.4 * cap ? 'under' : 'ok';
  return { mean, lo, hi, sigma, hist, share, booked, cap, censored, conf, level, method, util: cap ? mean / cap : 0, unmet: Math.max(0, mean - cap) };
}
const FC_LEVEL = {
  over:  ['ازدحام متوقع', 'tone-error', 'يُنصح بمراجعة السعة قبل اعتماد الرحلة.'],
  risk:  ['احتمال امتلاء', 'tone-warn',  'الطلب قريب من السعة؛ راقب الحجوزات.'],
  under: ['استغلال منخفض', 'tone-navy',  'يمكن دراسة حافلة أصغر أو دمج الرحلة.'],
  ok:    ['سعة مناسبة',    'tone-success','لا يلزم إجراء.'],
  done:  ['الطلب معروف',   'tone-teal',  'الرحلة انطلقت أو انتهت؛ العدد فعلي.']
};
/* Next five study days (excluding the demo day), per campus */
function weekAhead(){
  const days = []; for (let i = 1; i <= 5; i++) days.push((DEMO_DAY + i) % 5);
  return CAMPUSES.map(c => {
    const ts = tripsForCampus(c.id);
    return { c, cells: days.map(d => {
      const demand = sum(ts, t => histForecast(t.id, d, true)) * (1 + (state.demandAdj[c.id] || 0) / 100);
      const cap = sum(ts, t => t.capacity);
      return { d, demand, cap, util: cap ? demand / cap : 0 };
    }) };
  });
}

/* =========================================================
   2) DECISION AGENT (deterministic, rule-based)
   ========================================================= */
function agentObserve(sc){
  return TRIPS.map(t => {
    const rec = tripRecord(t);
    return { t, f: forecastTrip(t, sc), rec, booked: bookedRes(t).length, cap: capacityOf(t, sc),

function agentAnalyze(obs){
  const issues = [];
  obs.forEach(o => {
    const t = o.t, st = t.rt.status;
    if (st === 'completed') return;
    if (o.booked > o.cap) issues.push({ key:`viol:${t.id}`, type:'violation', severity:3, o, need:o.booked - o.cap });
    else if (st === 'scheduled' && o.f.level === 'over') issues.push({ key:`over:${t.id}`, type:'overcrowd', severity:2, o, need:Math.ceil(o.f.mean - o.cap) });
    else if (st === 'scheduled' && o.f.level === 'risk') issues.push({ key:`risk:${t.id}`, type:'risk', severity:1, o, need:Math.ceil(o.f.hi - o.cap) });
    if (tripActive(t) && o.delay >= 3) issues.push({ key:`delay:${t.id}`, type:'delay', severity: o.delay >= 8 ? 3 : 2, o });
    if (st === 'scheduled' && o.f.level === 'under' && o.cap > 12) issues.push({ key:`under:${t.id}`, type:'underuse', severity:1, o });

}
/* Each option: predicted effect + score (lower is better).
   Score = 10·unserved (3 when only a risk) + 4·extra bus + 1·moved student + 0.3·idle seats */
function agentOptions(issue, obs, claimed = new Set()){
  const avail = () => freeSpares().filter(s => !claimed.has(s.id));
  const o = issue.o, t = o.t, opts = [];
  const wU = issue.type === 'risk' ? 3 : 10;   // uncertain shortfall weighs less than a certain one
  const scoreOf = e => wU * e.unmet + 4 * (e.bus || 0) + 1 * (e.moved || 0) + 0.3 * (e.idle || 0);
  const mk = (id, label, kind, e, extra = {}) => { const s = { id, label, kind, effect:e, score:scoreOf(e), ...extra }; opts.push(s); return s; };
  if (issue.type === 'violation' || issue.type === 'overcrowd' || issue.type === 'risk'){
    const need = issue.need, actual = issue.type === 'violation';
    mk('none', 'عدم اتخاذ إجراء', 'none', { unmet:need, idle:0 });
    obs.filter(a => a.t !== t && a.t.routeId === t.routeId && a.t.rt.status === 'scheduled' && a.t.departure > state.clock && Math.abs(a.t.departure - t.departure) <= 60)
      .forEach(a => {
        const spare = Math.floor(a.cap - (actual ? a.booked : Math.max(a.booked, a.f.mean)));
        if (spare <= 0) return;
        const moved = Math.min(need, spare);
        mk('alt:' + a.t.id, actual ? `نقل ${studentsAr(moved)} إلى رحلة ${fmt(a.t.departure)}` : `توجيه الحجوزات الزائدة إلى رحلة ${fmt(a.t.departure)}`, actual ? 'move' : 'redirect',
          { unmet:need - moved, moved, idle:Math.max(0, spare - moved) }, { alt:a.t, spare });
      });
    avail().forEach(s => mk('spare:' + s.id, `إضافة ${s.name} (${s.seats} مقعدًا)`, 'spare',
      { unmet:Math.max(0, need - s.seats), bus:1, idle:Math.max(0, s.seats - need) }, { spareBus:s }));
  }
  if (issue.type === 'underuse'){
    const idle = Math.round(o.cap - o.f.hi);
    mk('none', 'الإبقاء على الحافلة الحالية', 'none', { unmet:0, idle });
    avail().filter(s => s.seats >= Math.ceil(o.f.hi) && s.seats >= o.booked && s.seats < o.cap)
      .forEach(s => mk('swap:' + s.id, `استبدال الحافلة بـ${s.name} (${s.seats} مقعدًا)`, 'swap', { unmet:0, bus:0.5, idle:Math.round(s.seats - o.f.hi) }, { spareBus:s }));
  }
  if (issue.type === 'delay'){
    const affected = bookedRes(t).filter(r => !r.boarded).length;
    mk('none', 'الاكتفاء بالتحديث التلقائي للطالبات', 'none', { unmet:0, idle:0 });
    opts[0].score = o.delay >= 8 ? 6 : 1;
    mk('notify', `إبلاغ ${t.campus.name} بتأخر وصول ${studentsAr(affected + boardedRes(t).length)}`, 'notify', { unmet:0, notified:affected }, { });
    opts[1].score = o.delay >= 8 ? 2 : 3;
  }
  return opts.sort((a,b) => a.score - b.score);
}
const ISSUE_TITLE = {
  violation:'الحجوزات تتجاوز السعة', overcrowd:'ازدحام متوقع', risk:'احتمال امتلاء', delay:'تأخير ملحوظ', underuse:'استغلال منخفض للسعة'
};
function agentReason(issue, best){
  const o = issue.o, t = o.t, f = o.f;
  const base = issue.type === 'violation' ? `الحجوزات المؤكدة ${o.booked} مقابل ${o.cap} مقعدًا، أي زيادة ${issue.need}.`
    : issue.type === 'delay' ? `الرحلة متأخرة نحو ${minsAr(o.delay)} عن موعد الوصول المجدول ${fmt(t.arrivalTime)}${t.rt.delay.reason ? `، والسبب المسجل: ${t.rt.delay.reason}` : ''}.`
    : issue.type === 'underuse' ? `الطلب المتوقع ${Math.round(f.mean)} (حتى ${Math.round(f.hi)}) من ${o.cap} مقعدًا، أي إشغال ${Math.round(f.util*100)}٪.`
    : `الطلب المتوقع ${Math.round(f.mean)} طالبة (نطاق ${Math.round(f.lo)}–${Math.round(f.hi)}) مقابل ${o.cap} مقعدًا، والمحجوز الآن ${o.booked}.`;
  let why;
  if (best.kind === 'none') why = issue.type === 'underuse' ? 'لا توجد حافلة أصغر متاحة تكفي الحد الأعلى للطلب، لذلك الإبقاء هو الأقل كلفة.' : 'الخيارات الأخرى لا تقلل العجز بما يبرر كلفتها.';
  else if (best.kind === 'spare') why = `${best.spareBus.name} تغطي ${best.effect.unmet ? `جزءًا من العجز ويبقى ${best.effect.unmet}` : 'العجز بالكامل'}${best.effect.unmet ? '' : ''}.`;
  else if (best.kind === 'redirect' || best.kind === 'move') why = `رحلة ${fmt(best.alt.departure)} على المسار نفسه فيها ${best.spare} مقاعد فائضة متوقعة، فتستوعب ${best.effect.moved} دون حافلة إضافية.`;
  else if (best.kind === 'swap') why = `${best.spareBus.name} تكفي الحد الأعلى للطلب وتحرر حافلة أكبر.`;
  else why = 'إبلاغ المقر يتيح ترتيب الحضور للمحاضرات الأولى.';
  const cap = issue.need && sum(freeSpares(), s => s.seats) < issue.need && issue.type !== 'underuse' && issue.type !== 'delay'
    ? ` تنبيه: العجز (${issue.need}) يتجاوز كامل السعة الاحتياطية المتاحة (${sum(freeSpares(), s => s.seats)} مقعدًا).` : '';
  return `${base} ${why}${cap}`;
}
function runAgent(sc){
  const obs = agentObserve(sc);
  /* Fleet-level allocation: higher-priority issues claim spare buses first */
  const claimed = new Set();
  const issues = agentAnalyze(obs).map(i => {
    const opts = agentOptions(i, obs, claimed), best = opts[0];
    if (best.spareBus) claimed.add(best.spareBus.id);
    const held = claimed.size && !best.spareBus && i.type !== 'delay' && freeSpares().some(s => claimed.has(s.id)) ? ' الحافلات الاحتياطية المتاحة مخصصة في هذه الدورة لمشكلات أعلى أولوية.' : '';
    return { ...i, opts, best, reason: agentReason(i, best) + held };
  });
  return { obs, issues, at: state.clock };
}

/* Executing an approved option (the only place the agent changes state) */
function agentExecute(issue, opt){
  const t = issue.o.t; let done = '';
  if (opt.kind === 'spare'){ state.spares[opt.spareBus.id] = t.id; done = `أُضيفت ${opt.spareBus.name} إلى ${tripLabel(t)}؛ السعة الآن ${t.capacity}.`; }
  else if (opt.kind === 'swap'){ state.spares[opt.spareBus.id] = t.id; state.capOverride[t.id] = 0; done = `استُبدلت حافلة ${tripLabel(t)} بـ${opt.spareBus.name}؛ السعة الآن ${t.capacity}.`; }
  else if (opt.kind === 'redirect'){ state.redirect[t.id] = opt.alt.id; done = `عند امتلاء ${tripLabel(t)} تُقترح على الطالبات رحلة ${fmt(opt.alt.departure)}.`; }
  else if (opt.kind === 'move'){
    const movable = bookedRes(t).filter(r => r.status === 'active' && !r.boarded).sort((a,b) => b.createdAt - a.createdAt).slice(0, opt.effect.moved);
    movable.forEach(r => {
      r.status = 'cancelled'; r.cancelledAt = state.clock; r.movedTo = opt.alt.id;
      state.reservations.push({ ...r, id:'R-' + (++state.seq), tripId:opt.alt.id, status:'active', createdAt:state.clock, movedFrom:t.id, flags:{ n5:false, n2:false, arrived:false } });
      if (r.studentId === ME) notify('student', { type:'warn', title:'نُقل حجزك إلى رحلة أخرى', body:`بعد اعتماد مسؤول النقل، نُقل حجزك من ${tripLabel(t)} إلى رحلة ${fmt(opt.alt.departure)} لأن الحجوزات تجاوزت السعة. نقطة الالتقاء كما هي.` });
    });
    notify(drvAud(t), { type:'info', title:'تعديل قائمة الركاب', body:`نُقلت ${studentsAr(movable.length)} إلى رحلة ${fmt(opt.alt.departure)}.` });
    notify(drvAud(opt.alt), { type:'info', title:'ركاب منقولون', body:`انضمت ${studentsAr(movable.length)} من ${tripLabel(t)}.` });
    done = `نُقلت ${studentsAr(movable.length)} من ${tripLabel(t)} إلى رحلة ${fmt(opt.alt.departure)}.`;
  }
  else if (opt.kind === 'notify'){ done = `أُرسل إشعار إلى ${t.campus.name} بتأخر ${tripLabel(t)} نحو ${minsAr(issue.o.delay)}.`; }
  state.agentLog.unshift({ id:++state.seq, time:state.clock, issue:ISSUE_TITLE[issue.type], trip:tripLabel(t), action:opt.label, result:done });
  log(`الوكيل الذكي (باعتماد المسؤول): ${done}`, 'bot', ['admin', drvAud(t)]);
  notify('admin', { type:'success', title:'نُفّذ إجراء معتمد', body:done });
}

/* =========================================================
   4) ROUTE OPTIMIZATION
   Travel-time model: straight-line distance × road factor ÷
   route speed, + 1 min dwell per stop, + 6 min per segment
   passing within 70 units of a flagged congestion zone.
   Exhaustive search over stop orders (≤ 5 stops → ≤ 120 orders),
   so the result is optimal *within this model only*.
   ========================================================= */
const ROAD_FACTOR = 1.3, CONG_RADIUS = 48, CONG_PENALTY = 7, SKIP_PENALTY = 5;
/* Hypothetical congested corridors and alternative-road waypoints on the schematic map */
const CORRIDORS = [
  { id:'c-shisha',  name:'تقاطع طريق الششة',     at:[765,500] },
  { id:'c-central', name:'وسط العزيزية',          at:[585,405] },
  { id:'c-ring',    name:'الدائري الثالث',        at:[455,318] },
  { id:'c-sharaie', name:'طريق الشرائع',          at:[868,255] },
  { id:'c-rusaifah',name:'طريق الرصيفة',          at:[275,435] }
];
const BYPASS = [[640,330],[700,560],[480,440],[360,330],[800,250],[920,330],[330,520],[220,300]];
const xyOf = s => s.destination ? [CAMPUS_BY_ID[s.id.replace('campus-','')].x, CAMPUS_BY_ID[s.id.replace('campus-','')].y] : [PICKUPS[s.id].x, PICKUPS[s.id].y];
function segDist(a, b, p){
  const dx = b[0]-a[0], dy = b[1]-a[1], L = dx*dx + dy*dy;
  const u = L ? clamp(((p[0]-a[0])*dx + (p[1]-a[1])*dy) / L, 0, 1) : 0;
  return Math.hypot(a[0] + u*dx - p[0], a[1] + u*dy - p[1]);
}
function segMinutes(route, a, b, zones){
  let m = Math.hypot(b[0]-a[0], b[1]-a[1]) * ROAD_FACTOR / route.speed;
  zones.forEach(z => { if (segDist(a, b, z) < CONG_RADIUS) m += CONG_PENALTY; });
  return m;
}
/* Best way to drive one leg: direct, or via one alternative-road waypoint */
function legBest(route, a, b, zones, bypass){
  let best = { m: segMinutes(route, a, b, zones), via: null };
  if (bypass) BYPASS.forEach(w => { const m = segMinutes(route, a, w, zones) + segMinutes(route, w, b, zones); if (m < best.m - 1e-9) best = { m, via:w }; });
  return best;
}
function stopDemand(t){
  const f = forecastTrip(t), pick = t.route.stops.filter(s => !s.destination);
  const booked = Object.fromEntries(pick.map(s => [s.id, bookedRes(t).filter(r => r.stopId === s.id).length]));
  const total = sum(pick, s => booked[s.id]);
  const scale = total ? f.mean / total : 0;
  return Object.fromEntries(pick.map(s => [s.id, total ? booked[s.id] * scale : f.mean / pick.length]));
}
function evalPlan(t, order, q, zones, bypass){
  const R = t.route, depot = R.points[0], dest = xyOf(R.dest);
  let time = 0, cur = depot, vias = 0; const boards = [], path = [depot];
  const go = to => { const l = legBest(R, cur, to, zones, bypass); time += l.m; if (l.via){ path.push(l.via); vias++; } path.push(to); cur = to; };
  order.forEach(s => { go(xyOf(s)); time += DWELL; boards.push([s, time]); });
  go(dest);
  const served = sum(boards, ([s]) => q[s.id]);
  const ride = served ? sum(boards, ([s, tb]) => q[s.id] * (time - tb)) / served : 0;
  const skipped = sum(R.stops.filter(s => !s.destination && !order.includes(s)), s => q[s.id]);
  return { order, time, ride, skipped, served, path, vias };
}
function permutations(a){ if (a.length <= 1) return [a.slice()]; const out = []; a.forEach((x,i) => permutations(a.slice(0,i).concat(a.slice(i+1))).forEach(p => out.push([x, ...p]))); return out; }
function optimizeTrip(t, objective, congestion){
  const zones = CORRIDORS.filter(c => congestion && congestion[c.id]).map(c => c.at);
  const q = stopDemand(t), pick = t.route.stops.filter(s => !s.destination);
  const f = forecastTrip(t), cap = t.capacity, unservedCap = Math.max(0, f.mean - cap);
  const obj = p => (objective === 'ride' ? p.ride : p.time) + SKIP_PENALTY * p.skipped;
  const perms = permutations(pick);
  const bestOf = (orders, bypass) => orders.map(o => evalPlan(t, o, q, zones, bypass)).reduce((a,b) => obj(b) < obj(a) - 1e-9 ? b : a);
  const current = { ...evalPlan(t, pick, q, zones, false), name:'المسار الحالي (الترتيب والطرق المعتمدة)', id:'current' };
  const detour = { ...evalPlan(t, pick, q, zones, true), name:'الترتيب نفسه مع طرق بديلة لتجنّب الازدحام', id:'detour' };
  const full = { ...bestOf(perms, true), name:'أفضل ترتيب للمحطات مع اختيار الطرق', id:'full' };
  const options = [current, detour, full];
  const req = pick.filter(s => q[s.id] >= 0.5);
  if (req.length && req.length < pick.length) options.push({ ...bestOf(permutations(req), true), name:'مسار مختصر لمحطات الطلب فقط', id:'express' });
  const key = p => p.order.map(s => s.id).join() + '|' + p.path.map(x => x.join(':')).join();
  options.forEach(o => { o.score = obj(o); o.util = cap ? Math.min(f.mean, cap) / cap : 0; o.unserved = unservedCap + o.skipped; o.same = key(o) === key(current); });
  const rec = options.reduce((a,b) => b.score < a.score - 0.05 && !b.same ? b : a, current);
  return { options, rec, current, q, f, cap, zones, searched: perms.length * (BYPASS.length + 1) };
}

/* =========================================================
   5) VEHICLE FEED — interface for future GPS / IoT
   Positions on the schematic map always come from the simulation.
   A real feed would call WessalVehicleFeed.ingest(tripId, fix).
   ========================================================= */
const VehicleFeed = {
  source(tripId){ return state.gpsFixes && state.gpsFixes[tripId] ? 'gps' : 'simulation'; },
  label(tripId){ return this.source(tripId) === 'gps' ? 'إحداثيات GPS مستلمة (غير معروضة على المخطط)' : 'محاكاة داخل المتصفح'; },
  ingest(tripId, fix){
    if (!TRIP_BY_ID[tripId]) throw new Error('unknown tripId');
    const { lat, lng, timestamp } = fix || {};
    if (![lat, lng].every(v => typeof v === 'number' && isFinite(v)) || Math.abs(lat) > 90 || Math.abs(lng) > 180) throw new Error('invalid coordinates');
    state.gpsFixes[tripId] = { lat, lng, speed: fix.speed ?? null, timestamp: timestamp || new Date().toISOString(), receivedAt: new Date().toISOString() };
    save(); render(); return true;
  }
};
window.WessalVehicleFeed = VehicleFeed;

      </tbody></table></div>
      <p class="muted small" style="margin-top:10px">من السجل فقط، مع إضافة طلب اليوم الفعلي إلى السجل بعد اكتمال كل رحلة. الأحمر: الطلب يتجاوز السعة.</p>

function agentTab(ag){

    ['eye','الرصد',`${ag.obs.length} رحلات، ${sum(ag.obs, o => o.booked)} حجزًا`],
    ['search','التحليل',`${ag.issues.length} مشكلات`],
    ['scale','تقييم البدائل',`${sum(ag.issues, i => i.opts.length)} بديلًا`],
    ['lightbulb','التوصية',`${open.filter(i => i.best.kind !== 'none').length} توصيات`],
    ['user-check','طلب الاعتماد','بانتظار المسؤول'],

  <ol class="cycle" aria-label="دورة قرار الوكيل">${stages.map(([i,l,d]) => `<li><span class="ci">${ic(i,'ic-sm')}</span><b>${l}</b><span class="muted small">${d}</span></li>`).join('')}</ol>
  <p class="muted small" style="margin:6px 0 16px">آخر رصد: الساعة <span class="num">${fmt(ag.at)}</span>. دالة الكلفة (الأقل أفضل): 10 × العجز (3 عند الاحتمال فقط) + 4 × حافلة إضافية + 1 × طالبة منقولة + 0.3 × مقعد شاغر.</p>
  ${open.length ? open.map(issueCard).join('') : `<div class="card empty">${ic('shield-check')}<b>لا توجد مشكلات تشغيلية حاليًا</b>جرّب سيناريو في التوأم الرقمي، مثل زيادة الطلب أو تقليل سعة حافلة.</div>`}
  ${dismissed ? `<p class="muted small" style="margin-top:10px">${ic('eye-off','ic-sm')} ${dismissed} مشكلات تم تجاهلها. <button class="link-btn" data-action="agentRestore">إظهارها</button></p>` : ''}
  <section class="card" style="margin-top:18px">
    <div class="card-head"><h3>${ic('clipboard-check')}سجل الإجراءات المنفذة</h3><span class="muted small">تُنفَّذ فقط بعد الاعتماد</span></div>
    ${state.agentLog.length ? `<ul class="feed">${state.agentLog.map(l => `<li><span class="fi">${ic('check','ic-sm')}</span><span class="ft"><b>${esc(l.action)}</b><br><span class="muted small">${esc(l.result)}</span></span><time class="num">${fmt(l.time)}</time></li>`).join('')}</ul>` : '<div class="empty">لم يُعتمد أي إجراء بعد. التوصيات أعلاه لم تُنفَّذ.</div>'}
  </section>`;
}
function issueCard(i){
  const sev = i.severity >= 3 ? ['عالية','tone-error'] : i.severity === 2 ? ['متوسطة','tone-warn'] : ['منخفضة','tone-navy'];
  const o = i.o, best = i.best;
  return `<article class="card issue">
    <div class="card-head"><h3>${ic(i.type === 'delay' ? 'timer' : i.type === 'underuse' ? 'trending-down' : 'users')}${ISSUE_TITLE[i.type]}: ${tripLabel(o.t)}</h3><span class="badge ${sev[1]}">أولوية ${sev[0]}</span></div>
    <div class="evidence">
      <span>محجوز <b class="num">${o.booked}</b></span><span>السعة <b class="num">${o.cap}</b></span>
      <span>الطلب المتوقع <b class="num">${r0(o.f.mean)}</b> <span class="muted">(${r0(o.f.lo)}–${r0(o.f.hi)})</span></span>
      ${o.delay ? `<span>التأخير <b class="num">${o.delay} د</b></span>` : ''}<span>ثقة التنبؤ <b>${o.f.conf}</b></span>
    </div>
    <div class="table-wrap"><table class="opts"><thead><tr><th>البديل</th><th>العجز المتبقي</th><th>طالبات منقولات</th><th>حافلات إضافية</th><th>مقاعد شاغرة</th><th>الكلفة</th></tr></thead><tbody>
      ${i.opts.map(x => `<tr class="${x === best ? 'best' : ''}"><td>${x === best ? `<span class="badge tone-teal plain">موصى به</span> ` : ''}${esc(x.label)}</td><td class="num">${r0(x.effect.unmet)}</td><td class="num">${x.effect.moved || 0}</td><td class="num">${x.effect.bus ? (x.kind === 'swap' ? 'استبدال' : x.effect.bus) : 0}</td><td class="num">${r0(x.effect.idle || 0)}</td><td class="num"><b>${x.score.toFixed(1)}</b></td></tr>`).join('')}
    </tbody></table></div>
    <p class="reason">${ic('lightbulb','ic-sm')} ${esc(i.reason)}</p>
    <div class="manage-actions">
      ${best.kind !== 'none' ? `<button class="btn btn-teal" data-action="agentApprove" data-issue="${i.key}" data-opt="${best.id}">${ic('user-check','ic-sm')} مراجعة واعتماد التوصية</button>` : `<span class="muted small">التوصية: لا يلزم إجراء.</span>`}
      <button class="btn btn-ghost" data-action="agentDismiss" data-issue="${i.key}">تجاهل</button>
    </div>
  </article>`;
}

/* ---------- 3) Digital-twin tab ---------- */
function networkSVG(selId){
  const road = d => `<path d="${d}" fill="none" stroke="var(--map-edge)" stroke-width="20" stroke-linecap="round"/><path d="${d}" fill="none" stroke="var(--map-road)" stroke-width="15" stroke-linecap="round"/>`;
  const routes = Object.values(ROUTE_BY_ID).map(R => {
    const ts = TRIPS.filter(t => t.routeId === R.id), act = ts.find(tripActive);
    const late = act && tripRecord(act).status === 'delayed';
    const color = late ? 'var(--warn)' : act ? 'var(--teal)' : 'var(--faint)';
    const sel = ts.some(t => t.id === selId);
    const pts = R.points.map(p => p.join(',')).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="${sel ? 8 : 5}" stroke-opacity="${act || sel ? 1 : .55}" stroke-dasharray="${act ? '' : '10 8'}" stroke-linejoin="round" stroke-linecap="round" marker-mid="${act ? 'url(#nchev)' : ''}"/>
      ${act ? `<polyline class="js-traveled" data-trip="${act.id}" points="${pts}" fill="none" stroke="var(--route-done)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="0 ${R.length.toFixed(1)}"/>` : ''}`;
  }).join('');
  const used = [...new Set(Object.values(ROUTE_BY_ID).flatMap(R => R.stops.filter(s => !s.destination).map(s => s.id)))];
  const stops = used.map(id => {
    const p = PICKUPS[id];
    const d = sum(TRIPS.filter(t => t.rt.status !== 'completed'), t => bookedRes(t).filter(r => r.stopId === id && !r.boarded).length);
    return `<g transform="translate(${p.x},${p.y})"><circle r="${8 + Math.min(12, d)}" fill="var(--teal)" fill-opacity=".16" stroke="var(--teal)" stroke-width="2"/><circle r="4" fill="var(--navy)"/>
      <text class="stop-label" x="${p.lbl[0]}" y="${p.lbl[1]}" text-anchor="middle" style="font-size:15px">${p.short}</text>
</g>`;
  }).join('');
  const campuses = CAMPUSES.filter(c => c.x != null).map(c => {
    const ts = tripsForCampus(c.id).filter(t => t.rt.status !== 'completed');
    const b = sum(ts, t => bookedRes(t).length), cap = sum(ts, t => t.capacity), f = sum(ts, t => forecastTrip(t).mean);
    const tone = f > cap ? 'var(--error)' : f > 0.9 * cap ? 'var(--warn)' : 'var(--navy)';
    const [lx, ly] = c.lbl;
    return `<g transform="translate(${c.x},${c.y})"><rect x="-15" y="-15" width="30" height="30" rx="8" fill="${tone}" stroke="#fff" stroke-width="3"/>
      <path d="M-5 7 V-7 M-5 -7 H6 L3 -3 L6 1 H-5" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
      <text class="stop-label" x="${lx}" y="${ly}" text-anchor="middle">${c.name}</text>
      ${cap ? `<g transform="translate(${lx},${ly + (ly < 0 ? -26 : 24)})"><rect x="-38" y="-14" width="76" height="22" rx="11" fill="${tone}"/><text y="2" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700">${r0(f)} / ${cap}</text></g>` : ''}</g>`;
  }).join('');
  const buses = TRIPS.filter(tripActive).map(t => {
    const [x,y] = pointAt(t.route, t.rt.sim.progress), late = tripRecord(t).status === 'delayed';
    return `<g class="js-bus" data-trip="${t.id}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><circle class="bus-pulse" r="22" fill="${late ? 'var(--warn)' : 'var(--navy)'}"/><circle r="14" fill="${late ? 'var(--warn)' : 'var(--bus)'}" stroke="#fff" stroke-width="3"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">${t.bus.replace(/\D/g,'')}</text></g>`;
  }).join('');
  return `<svg class="map-svg" viewBox="0 0 1000 640" role="img" aria-label="محاكاة رقمية لشبكة النقل: المقرات والمسارات والمحطات والحافلات الجارية">
    <defs><pattern id="nblocks" width="46" height="46" patternUnits="userSpaceOnUse"><rect x="4" y="4" width="38" height="38" rx="7" fill="var(--map-block)"/></pattern>
    <marker id="nchev" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M2.5 1.5 L7 5 L2.5 8.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></marker></defs>
    <rect width="1000" height="640" fill="var(--map-bg)"/><rect width="1000" height="640" fill="url(#nblocks)" opacity=".6"/>
    ${road('M-20 300 C 200 330 450 420 1020 380')}${road('M560 -20 C 540 200 610 420 520 660')}${road('M60 660 C 220 420 420 210 660 -20')}${road('M-20 560 C 300 520 640 600 1020 590')}${road('M760 -20 C 800 200 900 380 1020 470')}
    ${routes}${stops}${campuses}${buses}
  </svg>`;
}

/* =========================================================
   v4 — Home / nearby-pickup service with a dedicated fleet
   Modules: Routing (simulated road network, pluggable provider) ·
   Destinations (campus → college → building → gate) · Fleet &
   drivers · Ride requests · Dispatch agent:
     observe → reason (group + sequence + assign) → recommend → execute
   Approved groups become real trips inside the existing trip engine.
   ========================================================= */

/* ---------- 1. Routing: simulated road network ---------- */
const NO_SERVICE = [{ x:0, y:520, w:170, h:120 }, { x:680, y:0, w:180, h:125 }];
const inNoService = p => NO_SERVICE.some(z => p[0] >= z.x && p[0] <= z.x + z.w && p[1] >= z.y && p[1] <= z.y + z.h);
const ROAD = (() => {
  const xs = [60,180,300,420,540,660,780,900], ys = [60,170,280,390,500,610];
  const id = (i,j) => `n${i}_${j}`, nodes = [];
  xs.forEach((x,i) => ys.forEach((y,j) => { if (!inNoService([x,y])) nodes.push({ id:id(i,j), x, y, i, j }); }));
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const MAIN_ROWS = [280, 500], MAIN_COLS = [540, 780];
  const CLOSED = new Set(['n3_3|n4_3','n5_1|n5_2','n1_2|n1_3','n6_4|n7_4']);   // blocks without through-roads
  const edges = [];
  nodes.forEach(n => [[1,0],[0,1]].forEach(([di,dj]) => {
    const m = byId[id(n.i+di, n.j+dj)]; if (!m) return;
    const key = `${n.id}|${m.id}`; if (CLOSED.has(key)) return;
    edges.push({ key, a:n.id, b:m.id, len:Math.hypot(m.x-n.x, m.y-n.y), main: di ? MAIN_ROWS.includes(n.y) : MAIN_COLS.includes(n.x) });
  }));
  const adj = {}; nodes.forEach(n => adj[n.id] = []); edges.forEach(e => { adj[e.a].push(e); adj[e.b].push(e); });
  return { nodes, byId, edges, adj };
})();
const SPEED_MAIN = 36, SPEED_SEC = 24, SPEED_LINK = 16, ROAD_WIND = 1.12;   // map units per minute (demo calibration)
const incidentsVer = () => (state.incidents || []).map(z => `${z.id}:${z.factor}`).join(',');
function edgeMinutes(e){
  const a = ROAD.byId[e.a], b = ROAD.byId[e.b], mid = [(a.x+b.x)/2, (a.y+b.y)/2];
  let m = e.len * ROAD_WIND / (e.main ? SPEED_MAIN : SPEED_SEC);
  (state.incidents || []).forEach(z => { if (Math.hypot(mid[0]-z.at[0], mid[1]-z.at[1]) <= z.radius) m *= z.factor; });
  return m;
}
const _dij = {}, _rt = {};
function dijkstra(src){
  const k = src + '#' + incidentsVer(); if (_dij[k]) return _dij[k];
  const dist = {}, prev = {}, done = new Set();
  ROAD.nodes.forEach(n => dist[n.id] = Infinity); dist[src] = 0;
  for (;;){
    let u = null, best = Infinity;
    for (const n of ROAD.nodes) if (!done.has(n.id) && dist[n.id] < best){ best = dist[n.id]; u = n.id; }
    if (u === null) break; done.add(u);
    for (const e of ROAD.adj[u]){ const v = e.a === u ? e.b : e.a, nd = dist[u] + edgeMinutes(e); if (nd < dist[v]){ dist[v] = nd; prev[v] = u; } }
  }
  return _dij[k] = { dist, prev };
}
function nearestNode(p){ let b = null, d = Infinity; ROAD.nodes.forEach(n => { const x = Math.hypot(n.x-p[0], n.y-p[1]); if (x < d){ d = x; b = n; } }); return { node:b, d }; }
const RoutingProviders = {
  simulated: {
    id:'simulated', real:false, available:true, label:'شبكة طرق مبسطة (محاكاة داخل المتصفح)',
    route(a, b){
      const k = `${a}|${b}|${incidentsVer()}`; if (_rt[k]) return _rt[k];
      const A = nearestNode(a), B = nearestNode(b), link = d => d * ROAD_WIND / SPEED_LINK;
      if (A.node === B.node) return _rt[k] = { time: link(Math.hypot(a[0]-b[0], a[1]-b[1])), points:[a, b] };
      const { dist, prev } = dijkstra(A.node.id);
      if (!isFinite(dist[B.node.id])) return null;
      const chain = []; for (let v = B.node.id; v !== undefined; v = prev[v]){ chain.push(ROAD.byId[v]); if (v === A.node.id) break; }
      chain.reverse();
      const raw = [a, ...chain.map(n => [n.x, n.y]), b];
      const points = raw.filter((p,i) => i === 0 || Math.hypot(p[0]-raw[i-1][0], p[1]-raw[i-1][1]) > 0.5);
      return _rt[k] = { time: link(A.d) + dist[B.node.id] + link(B.d), points };
    }
  },
  external: {
    id:'external', real:true, available:false, label:'مزوّد خرائط وتوجيه خارجي (Google Maps Platform أو Mapbox)',
    requirement:'يتطلب خادمًا وسيطًا يحتفظ بمفتاح الخدمة في متغيرات البيئة. لا يُضمَّن أي مفتاح في هذه الواجهة.',
    route(){ throw new Error('ROUTING_PROVIDER_NOT_CONFIGURED'); }
  }
};
/* Production: set routingProvider:'external' only behind a backend proxy (e.g. /api/route) */
const WESSAL_CONFIG = { mode:'demo', routingProvider:'simulated', routingProxyUrl:null, gpsIngestUrl:null, backendUrl:null };
const Routing = { provider(){ return RoutingProviders[WESSAL_CONFIG.routingProvider]; }, route(a, b){ return this.provider().route(a, b); } };
/* Travel time along an existing polyline under current incidents (used to detect route degradation) */
function timeAlongPoints(points){
  let m = 0;
  for (let i = 1; i < points.length; i++){
    const a = points[i-1], b = points[i];
    const na = ROAD.nodes.find(n => n.x === a[0] && n.y === a[1]), nb = ROAD.nodes.find(n => n.x === b[0] && n.y === b[1]);
    const e = na && nb && ROAD.adj[na.id].find(x => x.a === nb.id || x.b === nb.id);
    m += e ? edgeMinutes(e) : Math.hypot(b[0]-a[0], b[1]-a[1]) * ROAD_WIND / SPEED_LINK;
  }
  return m;
}
