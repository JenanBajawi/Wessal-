function buildRouteSnap(vehicle, stops, gate){
  const seq = [{ id:'depot:' + vehicle.id, short:'موقف ' + vehicle.name, place:'نقطة انطلاق المركبة', xy:vehicle.depot, depot:true },
    ...stops, { id:'gate:' + gate.id, short:CAMPUS_BY_ID[gate.campusId].name, place:gate.name, xy:gate.xy, destination:true }];
  const points = [seq[0].xy], out = [{ ...seq[0], pi:0 }]; let driving = 0;
  for (let i = 1; i < seq.length; i++){
    const r = Routing.route(seq[i-1].xy, seq[i].xy); if (!r) return null;
    driving += r.time; r.points.slice(1).forEach(p => points.push(p)); out.push({ ...seq[i], pi:points.length - 1 });
  }
  return { points, stops: out, driving };
}
function routeFromSnap(id, campusId, snap){
  const cum = [0];
  for (let i = 1; i < snap.points.length; i++) cum.push(cum[i-1] + Math.hypot(snap.points[i][0]-snap.points[i-1][0], snap.points[i][1]-snap.points[i-1][1]));
  const stops = snap.stops.map((s,i) => ({ ...s, idx:i, dist:cum[s.pi], lbl: s.destination ? [0,-30] : s.depot ? [0,34] : [0,-24] }));
  const length = cum[cum.length - 1] || 1;
  return { id:'r-' + id, campusId, points:snap.points, stops, cum, length, speed: length / Math.max(1, snap.driving), traffic:false, trafficAt:Infinity,
    dest: stops[stops.length - 1], name: `${stops[1] ? stops[1].short : ''} إلى ${CAMPUS_BY_ID[campusId].name}`, dynamic:true };
}
function hydrateTrip(spec){
  const t = { id:spec.id, dynamic:true, spec, campusId:spec.campusId, gateId:spec.gateId, routeId:'r-' + spec.id, period:'استلام من المنزل أو نقطة قريبة' };
  t.route = routeFromSnap(spec.id, spec.campusId, spec.snap);
  t.campus = CAMPUS_BY_ID[spec.campusId];
  t.name = `رحلة وصّال إلى ${t.campus.name}`;
  t.meetingPoint = t.route.stops[1] ? t.route.stops[1].short : '';
  t.baseCapacity = VEH_BY_ID[spec.vehicleId].seats;
  Object.defineProperties(t, {
    departure:  { get(){ return spec.departure; }, configurable:true },
    driverId:   { get(){ return spec.driverId; }, configurable:true },
    vehicleId:  { get(){ return spec.vehicleId; }, configurable:true },
    bus:        { get(){ return VEH_BY_ID[spec.vehicleId].name; }, configurable:true },
    arrivalTime:{ get(){ return spec.departure + schedOffset(t.route, t.route.stops.length - 1); }, configurable:true },
    deadline:   { get(){ return spec.deadline; }, configurable:true },
    capacity:   { get(){ return capacityOf(t); }, configurable:true },
    rt:         { get(){ return state.rt[t.id]; }, configurable:true }
  });
  if (!state.rt[t.id]) state.rt[t.id] = freshRuntime();
  TRIPS.push(t); TRIP_BY_ID[t.id] = t;
  return t;
}
function hydrateDynamicTrips(){
  for (let i = TRIPS.length - 1; i >= 0; i--) if (TRIPS[i].dynamic){ delete TRIP_BY_ID[TRIPS[i].id]; TRIPS.splice(i, 1); }

const REQ_STAGES = [['received','تم استلام الطلب'],['searching','جارٍ البحث عن رحلة مناسبة'],['grouped','تم تجميع الرحلة'],['assigned','تم تعيين الحافلة'],

function reqStage(q){
  if (q.status === 'cancelled') return 'cancelled';
  if (q.status === 'missed') return 'missed';
  if (q.status === 'completed') return 'delivered';
  if (!q.tripId){

    return state.dispatch.lastRun != null && state.dispatch.lastRunSeq >= q.seq ? 'searching' : 'received';
  }
  const t = TRIP_BY_ID[q.tripId], r = state.reservations.find(x => x.id === q.resId);

  if (t.rt.status === 'cancelled') return 'cancelled';

/* =========================================================
   6. DISPATCH AGENT (deterministic, transparent; not ML)
   ========================================================= */
const DISPATCH_RULES = { maxEarly:25, buffer:5, detourRatio:1.6, detourAdd:10, minLead:3, exactStops:6 };

/* 6a. Observe: snapshot of the operational state */
function observeDispatch(){
  const vehicles = VEHICLES.filter(v => v.pool === 'ondemand').map(v => ({ v, operational: vehicleOperational(v), status: vehicleStatus(v), driverId: vState(v).driverId }));
  return { now: state.clock, pending: state.requests.filter(q => q.status === 'active' && !q.tripId), vehicles, gates: state.places.gates };
}

/* 6b. Reason: group compatible requests, sequence pickups, choose vehicles */
function seqGroup(reqs, gate){
  const m = new Map();
  reqs.forEach(q => { const k = pickupKey(q); if (!m.has(k)) m.set(k, { key:k, xy:pickupXY(q), reqs:[], home:q.pickup.type === 'home', q }); m.get(k).reqs.push(q); });
  const stops = [...m.values()];
  const direct = {};
  for (const s of stops){ const r = Routing.route(s.xy, gate.xy); if (!r) return { feasible:false, why:'no-route' }; direct[s.key] = r.time; }
  let orders;
  if (stops.length <= DISPATCH_RULES.exactStops) orders = permutations(stops);
  else { // nearest-neighbour from the stop farthest from the gate
    const left = stops.slice().sort((a,b) => direct[b.key] - direct[a.key]); const o = [left.shift()];
    while (left.length){ const cur = o[o.length-1]; left.sort((a,b) => Routing.route(cur.xy, a.xy).time - Routing.route(cur.xy, b.xy).time); o.push(left.shift()); }
    orders = [o];
  }
  let best = null;
  for (const o of orders){
    const legs = o.map((s,i) => Routing.route(s.xy, i < o.length - 1 ? o[i+1].xy : gate.xy).time);
    const total = sum(legs);
    let ok = true, maxDet = 0;
    for (let i = 0; i < o.length; i++){
      const ride = sum(legs.slice(i)) + DWELL * (o.length - 1 - i), d = direct[o[i].key];
      if (ride > Math.max(d * DISPATCH_RULES.detourRatio, d + DISPATCH_RULES.detourAdd) + 1e-9){ ok = false; break; }
      maxDet = Math.max(maxDet, ride - d);
    }
    if (ok && (!best || total < best.total)) best = { order:o, total, maxDet };
  }
  return best ? { feasible:true, ...best, direct, evaluated:orders.length } : { feasible:false, why:'detour', evaluated:orders.length };
}
function homeLabelMap(order){ let h = 0; return order.map(s => s.home ? `استلام منزلي ${++h}` : PICKUPS[s.q.pickup.pointId].short); }
function scheduleOn(v, g, gate){
  const labels = homeLabelMap(g.seq.order);
  const stops = g.seq.order.map((s,i) => ({ id:s.key, short:labels[i], place: s.home ? 'موقع استلام خاص' : PICKUPS[s.q.pickup.pointId].place, xy:s.xy, home:s.home }));
  const snap = buildRouteSnap(v, stops, gate); if (!snap) return null;
  const route = routeFromSnap('tmp', gate.campusId, snap), destIdx = route.stops.length - 1;
  const span = schedOffset(route, destIdx);
  let departure = g.minDeadline - DISPATCH_RULES.buffer - span;
  const earliest = state.clock + DISPATCH_RULES.minLead;
  if (departure < earliest) departure = earliest;
  const arrival = departure + span;
  const pickups = route.stops.slice(1, -1).map(s => ({ key:s.id, label:s.short, eta: departure + schedOffset(route, s.idx), count: g.seq.order.find(o => o.key === s.id).reqs.length }));
  return { snap, departure, arrival, late: arrival > g.minDeadline + 0.01, deadhead: Routing.route(v.depot, stops[0].xy).time, pickups };
}
const groupSig = (vid, reqs) => vid + ':' + reqs.map(q => q.id).sort().join(',');
function reasonDispatch(obs){
  const out = { groups:[], blocked:[], unassigned:[], evaluated:0 };
  const fleet = obs.vehicles.filter(x => x.operational).map(x => x.v);
  const maxCap = fleet.length ? Math.max(...fleet.map(v => v.seats)) : 0;
  const valid = [];
  obs.pending.forEach(q => {
    const g = gateById(q.gateId);
    if (!g) return out.blocked.push({ q, code:'no-gate', text:'بوابة الوصول المختارة لم تعد موجودة.' });
    if (!Array.isArray(g.xy)) return out.blocked.push({ q, code:'no-coords', text:`«${g.name}» بلا إحداثيات؛ لا يمكن حساب المسار حتى يضيفها المسؤول.` });
    const r = Routing.route(pickupXY(q), g.xy);
    if (!r) return out.blocked.push({ q, code:'no-route', text:'لا يوجد مسار على شبكة الطرق بين نقطة الاستلام والبوابة.' });
    const minDead = fleet.length ? Math.min(...fleet.map(v => Routing.route(v.depot, pickupXY(q)).time)) : 0;
    const earliest = state.clock + DISPATCH_RULES.minLead + DWELL * 2 + minDead + r.time;
    if (earliest > q.deadline) return out.blocked.push({ q, code:'deadline', text:`الموعد المطلوب ${fmt(q.arriveBy)} غير ممكن حتى برحلة منفردة؛ أقرب وصول ممكن ${fmt(earliest)}.` });
    valid.push(q);
  });
  if (!maxCap){ valid.forEach(q => out.blocked.push({ q, code:'no-vehicle', text:'لا توجد مركبة تشغيلية بسائق متاح.' })); return out; }
  /* Group within compatible partitions: same approved gate + deadlines within maxEarly */
  const parts = {};
  valid.forEach(q => (parts[q.gateId] = parts[q.gateId] || []).push(q));
  const groups = [];
  Object.entries(parts).forEach(([gid, list]) => {
    const gate = gateById(gid), local = [];
    list.sort((a,b) => a.deadline - b.deadline).forEach(q => {
      let best = null;
      local.forEach(g => {
        if (q.deadline - g.minDeadline > DISPATCH_RULES.maxEarly || g.reqs.length + 1 > maxCap) return;
        const cand = seqGroup(g.reqs.concat(q), gate); out.evaluated += cand.evaluated || 0;
        if (!cand.feasible) return;
        const added = cand.total - g.seq.total;
        if (!best || added < best.added) best = { g, cand, added };
      });
      if (best){ best.g.reqs.push(q); best.g.seq = best.cand; }
      else { const seq = seqGroup([q], gate); out.evaluated += seq.evaluated || 0; local.push({ gateId:gid, gate, reqs:[q], seq, minDeadline:q.deadline }); }
    });

  const busy = new Map(fleet.map(v => [v.id, busyWindows(v)]));
  const busyD = new Map(fleet.map(v => [vState(v).driverId, driverWindows(vState(v).driverId)]));
  const queue = groups.sort((a,b) => a.minDeadline - b.minDeadline);
  while (queue.length){
    const g = queue.shift(), n = g.reqs.length;
    const cands = fleet.map(v => {
      if (v.seats < n) return { v, note:`سعتها ${v.seats} أقل من ${n}` };
      if (state.dispatch.rejected[groupSig(v.id, g.reqs)]) return { v, note:'رفضها المسؤول لهذه المجموعة' };
      const plan = scheduleOn(v, g, g.gate); if (!plan) return { v, note:'تعذّر حساب المسار' };
      if (overlaps(busy.get(v.id), [plan.departure, plan.arrival + 10])) return { v, note:'مشغولة في هذا الوقت' };
      if (overlaps(busyD.get(vState(v).driverId) || [], [plan.departure, plan.arrival + 10])) return { v, note:`السائق ${DRIVER_BY_ID[vState(v).driverId].short} مشغول في رحلة أخرى` };
      return { v, plan, score: 3 * (v.seats - n) + plan.deadhead + (plan.late ? 100 : 0) };
    });
    const ok = cands.filter(c => c.plan).sort((a,b) => a.score - b.score);
    if (ok.length){
      const best = ok[0]; busy.get(best.v.id).push([best.plan.departure, best.plan.arrival + 10]); (busyD.get(vState(best.v).driverId) || []).push([best.plan.departure, best.plan.arrival + 10]);
      out.groups.push({ ...g, vehicle:best.v, plan:best.plan, cands });
      continue;
    }
    const freeSmaller = fleet.filter(v => v.seats < n && v.seats > 0).sort((a,b) => b.seats - a.seats);
    if (n > 1 && freeSmaller.length && !g.split){
      const k = freeSmaller[0].seats, a = g.reqs.slice(0, k), b = g.reqs.slice(k);
      [a, b].forEach(part => { const seq = seqGroup(part, g.gate); if (seq.feasible) queue.unshift({ ...g, reqs:part, seq, minDeadline:Math.min(...part.map(q => q.deadline)), split:true }); else part.forEach(q => out.unassigned.push({ g:{ ...g, reqs:[q] }, why:'لا يوجد تسلسل يحترم حد الانحراف' })); });
      queue.sort((x,y) => x.minDeadline - y.minDeadline);
      continue;
    }
    out.unassigned.push({ g, cands, why: cands.length ? 'لا توجد مركبة متاحة بسعة كافية في الوقت المطلوب' : 'لا توجد مركبات تشغيلية' });
  }

}

/* 6c. Recommend: turn reasoning into explainable proposals */

    const ds = g.reqs.map(q => q.deadline), quality = ['التوجيه: محاكاة على شبكة طرق مبسطة'];
    if (!gate.verified) quality.push('إحداثيات البوابة غير موثقة');
    const homes = g.reqs.filter(q => q.pickup.type === 'home').length; if (homes) quality.push(`${homes} مواقع منزلية محددة على المخطط`);
    const conf = plan.late || !gate.verified ? 'منخفضة' : 'متوسطة';
    recs.push({
      id:'DR-' + (++state.seq), type:'assign', status:'proposed', createdAt:state.clock,
      requestIds: g.reqs.map(q => q.id), gateId:gate.id, campusId:gate.campusId, vehicleId:v.id, driverId:vState(v).driverId,
      departure:plan.departure, arrival:plan.arrival, deadline:g.minDeadline, late:plan.late, deadhead:plan.deadhead, pickups:plan.pickups,
      maxDetour:g.seq.maxDet, seats:v.seats, students:n, confidence:conf, quality,
      alternatives: g.cands.map(c => ({ vehicleId:c.v.id, score:c.score, note:c.note || (c.v === v ? 'المختارة' : '') })),
      reasons: [
        `${studentsAr(n)} إلى ${CAMPUS_BY_ID[gate.campusId].name}، ${gate.name}، بمواعيد وصول بين ${fmt(Math.min(...ds))} و${fmt(Math.max(...ds))} (فرق لا يتجاوز ${DISPATCH_RULES.maxEarly} دقيقة).`,
        `تسلسل الاستلام هو الأقصر بين ${g.seq.evaluated} ترتيبًا يحترم حد الانحراف؛ أقصى زيادة على الرحلة المباشرة ${minsAr(g.seq.maxDet)}.`,
        `${v.name} (${v.seats} مقاعد) هي الأنسب: ${v.seats - n ? `${v.seats - n} مقاعد شاغرة فقط` : 'تمتلئ بالكامل'}، وتصل إلى أول نقطة استلام خلال ${minsAr(plan.deadhead)}.`,
        plan.late ? `تحذير: أقرب وصول ممكن ${fmt(plan.arrival)} بعد أقرب موعد مطلوب ${fmt(g.minDeadline)}.` : `الوصول المتوقع ${fmt(plan.arrival)} قبل أقرب موعد مطلوب ${fmt(g.minDeadline)}.`
      ]
    });
  });
  const byCode = {};
  rs.blocked.forEach(b => (byCode[b.code] = byCode[b.code] || []).push(b));
  Object.entries(byCode).forEach(([code, list]) => recs.push({ id:'DR-' + (++state.seq), type:'intervention', status:'proposed', createdAt:state.clock, code,
    requestIds: list.map(b => b.q.id), students:list.length, title: { 'no-coords':'بوابة بلا إحداثيات', 'no-gate':'بوابة غير موجودة', 'no-route':'لا يوجد مسار', deadline:'موعد وصول غير ممكن', 'no-vehicle':'لا توجد مركبات تشغيلية' }[code],
    reasons: list.map(b => `${b.q.id}: ${b.text}`), action: code === 'deadline' ? 'التواصل مع الطالبة لتعديل الموعد أو إلغاء الطلب' : code === 'no-vehicle' ? 'إعادة مركبة إلى الخدمة أو تعيين سائق' : 'إكمال بيانات الوجهة من صفحة المقرات والوجهات' }));
  rs.unassigned.forEach(u => recs.push({ id:'DR-' + (++state.seq), type:'intervention', status:'proposed', createdAt:state.clock, code:'unassigned',
    requestIds:u.g.reqs.map(q => q.id), students:u.g.reqs.length, title:'مجموعة دون مركبة', reasons:[`${studentsAr(u.g.reqs.length)} إلى ${u.g.gate.name} (${CAMPUS_BY_ID[u.g.gate.campusId].name}): ${u.why}.`, ...(u.cands || []).map(c => `${c.v.name}: ${c.note || '—'}`)],
    action:'إضافة مركبة أو تعديل المواعيد' }));
  return recs;
}
function replan(){
  const rs = reasonDispatch(observeDispatch());
  state.dispatch.proposals = recommendDispatch(rs);
  state.dispatch.lastRun = state.clock; state.dispatch.lastRunSeq = state.seq; state.dispatch.evaluated = rs.evaluated;
  return rs;
}

/* 6d. Execute (only after approval) */
function dispatchHistory(entry){ state.dispatch.history.unshift({ id:++state.seq, time:state.clock, ...entry }); if (state.dispatch.history.length > 60) state.dispatch.history.length = 60; }
function executeAssign(rec){
  const fail = why => { rec.status = 'failed'; dispatchHistory({ kind:'assign', status:'failed', title:'تعذّر تنفيذ توصية', result:why }); toastMsg('error', 'تعذّر التنفيذ', why); return false; };
  const reqs = rec.requestIds.map(reqById);
  if (reqs.some(q => !q || q.status !== 'active' || q.tripId)) return fail('تغيّرت حالة بعض الطلبات منذ إنشاء التوصية.');
  const v = VEH_BY_ID[rec.vehicleId], gate = gateById(rec.gateId);
  if (!vehicleOperational(v)) return fail(`${v.name} لم تعد متاحة للتشغيل.`);
  if (v.seats < reqs.length) return fail('عدد الطالبات يتجاوز سعة المركبة.');
  if (!gate || !gate.xy) return fail('بوابة الوصول بلا إحداثيات.');
  const seq = seqGroup(reqs, gate); if (!seq.feasible) return fail('لم يعد هناك تسلسل يحترم حد الانحراف.');
  const g = { reqs, seq, minDeadline:Math.min(...reqs.map(q => q.deadline)) };

  if (overlaps(driverWindows(vState(v).driverId), [plan.departure, plan.arrival + 10])) return fail('سائق المركبة مشغول في رحلة أخرى في هذا الوقت.');

    requestIds:reqs.map(q => q.id), deadhead:plan.deadhead, snap:plan.snap, createdAt:state.clock, recId:rec.id };

  log(`اعتُمدت توصية الإرسال: ${tripLabel(t)} على ${t.bus} (${studentsAr(reqs.length)})`, 'bot', ['admin', drvAud(t)]);

/* 6e. Monitor: reassignment, late-arrival risk, route degradation */
function monitorDispatch(){
  const out = [];
  const fleet = VEHICLES.filter(v => v.pool === 'ondemand' && vehicleOperational(v));
  dynTrips().filter(t => t.rt.status === 'scheduled' || tripActive(t)).forEach(t => {
    const v = VEH_BY_ID[t.vehicleId], need = bookedRes(t).length, active = tripActive(t);
    if (!vehicleOperational(v)){
      const from = active ? pointAt(t.route, t.rt.sim.progress) : t.route.stops[1].xy;
      const cands = fleet.filter(x => x !== v && x.seats >= need && (active || !overlaps(busyWindows(x), [t.departure, t.arrivalTime + 10])) && !vehicleTrips(x).some(tripActive))
        .map(x => { const dh = Routing.route(vehiclePos(x), from).time; return { x, dh, score: dh + 2 * (x.seats - need) }; }).sort((a,b) => a.score - b.score);
      const best = cands[0], why = vState(v).ops !== 'active' ? (vState(v).ops === 'maintenance' ? 'تحت الصيانة' : 'خارج الخدمة') : 'سائقها غير متاح';
      out.push({ key:`reassign:${t.id}:${v.id}`, type:'reassign', severity:3, tripId:t.id, title:`${t.bus} ${why}: ${tripLabel(t)}`,
        action: best ? `نقل الرحلة إلى ${best.x.name} (${best.x.seats} مقاعد)` : 'لا توجد مركبة بديلة مناسبة؛ يلزم تدخل المسؤول',
        reasons:[`${studentsAr(need)} مرتبطات بهذه الرحلة${active ? ' وهي جارية الآن' : ''}.`, ...cands.slice(0,3).map(c => `${c.x.name}: تصل خلال ${minsAr(c.dh)}، ${c.x.seats} مقاعد.`), ...(cands.length ? [] : ['لا توجد مركبة تشغيلية بسعة كافية وغير مشغولة.'])],
        exec: best ? { kind:'reassign', vehicleId:best.x.id, delay: active ? Math.ceil(best.dh) : 0 } : null, affected:need });
    }
    let delayNow = 0;
    if (t.rt.status === 'scheduled' && (state.incidents || []).length){
      delayNow = Math.max(0, timeAlongPoints(t.route.points) - t.spec.snap.driving);
      if (delayNow > 1){
        const reqs = bookedRes(t).map(r => reqById(r.requestId)).filter(Boolean), gate = gateById(t.gateId);
        const seq = reqs.length && gate ? seqGroup(reqs, gate) : null;
        const plan = seq && seq.feasible ? scheduleOn(v, { reqs, seq, minDeadline:t.deadline }, gate) : null;
        if (plan && plan.snap.driving < t.spec.snap.driving + delayNow - 1)
          out.push({ key:`reroute:${t.id}:${incidentsVer()}`, type:'reroute', severity:2, tripId:t.id, title:`ازدحام على مسار ${tripLabel(t)}`,
            action:`تعديل المسار (يوفر ${minsAr(t.spec.snap.driving + delayNow - plan.snap.driving)})`,
            reasons:[`المسار المعتمد أصبح أبطأ بنحو ${minsAr(delayNow)} بسبب ${state.incidents.map(z => z.label).join('، ')}.`, `مسار بديل على الشبكة يستغرق ${minsAr(plan.snap.driving)} بدل ${minsAr(t.spec.snap.driving + delayNow)}.`],
            exec:{ kind:'reroute', snap:plan.snap, departure:plan.departure }, affected:reqs.length });
      }
    }
    const est = active ? estArrival(t, t.route.dest.idx) : t.arrivalTime + delayNow;
    if (est != null && est > t.deadline + 0.5){
      const late = Math.ceil(est - t.deadline);
      const canAdvance = t.rt.status === 'scheduled' && t.departure - late - 1 >= state.clock + DISPATCH_RULES.minLead;
      out.push({ key:`late:${t.id}:${late}`, type:'late', severity: late >= 8 ? 3 : 2, tripId:t.id, title:`خطر وصول متأخر: ${tripLabel(t)}`,
        action: canAdvance ? `تقديم الانطلاق ${minsAr(late + 1)} (إلى ${fmt(t.departure - late - 1)})` : `إشعار ${studentsAr(need)} بالتأخر المتوقع`,
        reasons:[`الوصول المتوقع ${fmt(est)} بعد أقرب موعد مطلوب ${fmt(t.deadline)} بنحو ${minsAr(late)}.`, canAdvance ? 'الوقت المتبقي قبل الانطلاق يسمح بتقديمه دون تجاوز الحد الأدنى للمهلة.' : 'لا يمكن تقديم الانطلاق؛ الإشعار المبكر يقلل أثر التأخير.'],
        exec: canAdvance ? { kind:'advance', minutes:late + 1 } : { kind:'notify', minutes:late }, affected:need });
    }
  });
  return out.filter(m => !state.dispatch.dismissed[m.key]).sort((a,b) => b.severity - a.severity);
}
function executeMonitor(m){
  const t = TRIP_BY_ID[m.tripId], e = m.exec; let result = '';
  if (!t || !e) return false;
  if (e.kind === 'reassign'){
    const nv = VEH_BY_ID[e.vehicleId], old = t.bus;
    t.spec.vehicleId = nv.id; t.spec.driverId = vState(nv).driverId; t.baseCapacity = nv.seats;
    if (e.delay && t.rt.status === 'in_progress') addDelay(t, e.delay, `استبدال المركبة ${old}`);
    if (e.delay && t.rt.status === 'paused'){ t.rt.sim.hold += e.delay; t.rt.delay.total += e.delay; t.rt.delay.reason = `استبدال المركبة ${old}`; t.rt.delay.events.push({ min:e.delay, reason:t.rt.delay.reason, time:state.clock }); }
    bookedRes(t).filter(r => r.studentId === ME).forEach(() => notify('student', { type:'warn', title:'تغيّرت المركبة', body:`ستصلك ${nv.name} مع الكابتن ${DRIVER_BY_ID[t.driverId] ? DRIVER_BY_ID[t.driverId].short : '—'} بدل ${old}.` }));
    notify(drvAud(t), { type:'trip', title:'أُسندت إليك رحلة', body:`${tripLabel(t)} بعد استبدال ${old}.` });

    result = `أُشعرت ${studentsAr(m.affected)} بتأخر متوقع نحو ${minsAr(e.minutes)}.`;
  }
  dispatchHistory({ kind:m.type, status:'executed', title:m.title, result });
  log(`وكيل الإرسال (باعتماد المسؤول): ${result}`, 'bot', ['admin', drvAud(t)]);
  return true;
}

function reqDraft(){
  if (!ui.req) ui.req = { pickupType:'point', pointId:'shisha', home:null, campusId:'zaher', collegeId:'', buildingId:'', gateId:'g-zaher-main', mode:'scheduled', arriveBy:7*60+50, errors:[] };

function draftGate(d){

}
function validateRequest(d){

  if (myActiveRequest()) errors.push('لديك طلب استلام قيد المعالجة.');
  let xy = null;
  if (d.pickupType === 'point'){ if (!PICKUPS[d.pointId]) errors.push('اختاري نقطة استلام معتمدة.'); else xy = [PICKUPS[d.pointId].x, PICKUPS[d.pointId].y]; }
  else if (!d.home) errors.push('حدّدي موقعك المنزلي على المخطط.');
  else if (d.home[0] < 20 || d.home[0] > 980 || d.home[1] < 20 || d.home[1] > 620 || inNoService(d.home)) errors.push('الموقع المحدد خارج نطاق الخدمة التجريبي. اختاري موقعًا داخل المنطقة المخدومة أو نقطة استلام معتمدة.');
  else if (nearestNode(d.home).d > 90) errors.push('الموقع بعيد عن شبكة الطرق المتاحة. اختاري نقطة استلام معتمدة قريبة.');
  else xy = d.home;
  const campus = CAMPUS_BY_ID[d.campusId];
  if (!campus || campus.x == null) errors.push('اختاري المقر الجامعي.');
  const b = d.buildingId && buildingById(d.buildingId);
  if (b && b.campusId !== d.campusId) errors.push('المبنى المختار لا يتبع هذا المقر.');
  if (b && d.collegeId && b.collegeId && b.collegeId !== d.collegeId) errors.push('المبنى المختار لا يتبع الكلية المختارة.');
  const gate = draftGate(d);
  if (!gate) errors.push('اختاري بوابة الوصول.');
  else if (gate.campusId !== d.campusId) errors.push('بوابة الوصول لا تتبع المقر المختار.');
  else if (!Array.isArray(gate.xy)) errors.push(`إحداثيات «${gate.name}» غير متوفرة، فلا يمكن حساب المسار. اختاري بوابة أخرى أو تواصلي مع مسؤول النقل.`);
  let direct = null, deadline = null;
  if (xy && gate && Array.isArray(gate.xy)){
    const r = Routing.route(xy, gate.xy);
    if (!r) errors.push('لا يوجد مسار على شبكة الطرق إلى هذه البوابة.');
    else {
      direct = r.time;
      if (d.mode === 'scheduled'){

/* ---------- Dispatch scenario simulation (never touches real records) ---------- */
function dispatchMetrics(rs){
  const served = sum(rs.groups, g => g.reqs.length);
  const seats = sum(rs.groups, g => g.vehicle.seats);
  const early = rs.groups.flatMap(g => g.reqs.map(q => q.deadline - g.plan.arrival));
  const rides = rs.groups.flatMap(g => g.reqs.map(q => { const p = g.plan.pickups.find(x => x.key === pickupKey(q)); return p ? g.plan.arrival - p.eta : 0; }));
  return { served, unassigned: rs.blocked.length + sum(rs.unassigned, u => u.g.reqs.length), vehicles: rs.groups.length, util: seats ? served / seats : 0,
    early: early.length ? sum(early) / early.length : 0, ride: rides.length ? sum(rides) / rides.length : 0, late: rs.groups.filter(g => g.plan.late).length };
}
function simulateDispatch(sc){
  const saved = state, savedSeats = VEHICLES.map(v => v.seats);
  const base = dispatchMetrics(reasonDispatch(observeDispatch()));
  state = JSON.parse(JSON.stringify(saved));
  try {
    const gate = gateById('g-' + sc.campusId + '-main'), ids = Object.keys(PICKUPS);
    const addReqs = (n, deadline) => { for (let i = 0; i < n; i++){ const pid = ids[(i * 3 + sc.campusId.length) % ids.length];
      state.requests.push({ id:'SIM-' + i, studentId:'s' + (120 + (i % 10)), pickup:{ type:'point', pointId:pid }, campusId:sc.campusId, gateId:gate.id, mode:'scheduled', arriveBy:deadline, deadline, status:'active', createdAt:state.clock, tripId:null, seq:0 }); } };
    if (sc.kind === 'surge') addReqs(sc.n, sc.deadline);
    if (sc.kind === 'demand'){ const n = Math.round(state.requests.filter(q => q.status === 'active' && !q.tripId && q.campusId === sc.campusId).length * sc.pct / 100); if (n > 0) addReqs(n, 8*60); else state.requests.filter(q => q.campusId === sc.campusId && q.status === 'active' && !q.tripId).slice(0, -n).forEach(q => q.status = 'cancelled'); }
    if (sc.kind === 'vehicle') vState(VEH_BY_ID[sc.vehicleId]).ops = 'out_of_service';
    if (sc.kind === 'capacity') VEH_BY_ID[sc.vehicleId].seats = Math.max(1, VEH_BY_ID[sc.vehicleId].seats - sc.seats);
    if (sc.kind === 'road') state.incidents.push({ id:'sim-road', at:[PICKUPS[sc.area].x, PICKUPS[sc.area].y], radius:120, factor:sc.factor, label:'سيناريو' });
    if (sc.kind === 'pickup') state.incidents.push({ id:'sim-pickup', at:[PICKUPS[sc.area].x, PICKUPS[sc.area].y], radius:55, factor:2.2, label:'سيناريو' });
    const rs = reasonDispatch(observeDispatch());
    return { base, next: dispatchMetrics(rs), groups: rs.groups.map(g => ({ gate:g.gate.name, campus:CAMPUS_BY_ID[g.gate.campusId].short, n:g.reqs.length, vehicle:g.vehicle.name, seats:g.vehicle.seats, arrival:g.plan.arrival, deadline:g.minDeadline, late:g.plan.late })),
      blocked: rs.blocked.map(b => b.text).concat(rs.unassigned.map(u => u.why)) };
  } finally { state = saved; VEHICLES.forEach((v,i) => v.seats = savedSeats[i]); }
}

/* =========================================================
   Driver: operations card
   ========================================================= */
function driverOpsCard(t){
  if (!t || t.rt.status === 'cancelled') return t ? `<div class="notice tone-error" style="margin-bottom:18px">${ic('x','ic-sm')}<div>أُلغيت هذه الرحلة. لا يلزم أي إجراء.</div></div>` : '';
  const active = tripActive(t), n = nextStopIdx(t), nextIsDest = n === t.route.dest.idx;
  const gate = t.dynamic ? gateById(t.gateId) : null;
  const reqs = bookedRes(t).map(r => r.requestId && reqById(r.requestId)).filter(Boolean);
  const blds = [...new Set(reqs.map(q => [q.collegeId && collegeById(q.collegeId)?.name, q.buildingId && buildingById(q.buildingId)?.name].filter(Boolean).join('، ')).filter(Boolean))];
  const pickups = t.route.stops.filter(s => !s.destination && !s.depot);
  return `<section class="card ops" aria-labelledby="opsTitle" style="margin-bottom:18px">
    <div class="card-head"><h3 id="opsTitle">${ic('clipboard-list')}إجراءات الرحلة</h3><span class="muted small">في وضع العرض تُحاكى الإجراءات محليًا ولا تتزامن مع أجهزة أخرى</span></div>
    <div class="grid-2">
      <div>
        <h4 class="sub">${ic('flag','ic-sm')} الوجهة ونقطة الإنزال</h4>
        <p><b>${t.campus.name}</b>${gate ? `، ${esc(gate.name)} <span class="badge ${gate.verified ? 'tone-success' : 'tone-warn'} plain">${gate.verified ? 'موثقة' : 'غير موثقة'}</span>` : '، نقطة الوصول المعتمدة للخط'}</p>
        ${blds.length ? `<p class="muted small">مبانٍ مطلوبة: ${esc(blds.join(' | '))}</p>` : ''}
        <h4 class="sub">${ic('list-ordered','ic-sm')} نقاط الاستلام بالترتيب الموصى به</h4>
        <ol class="seq">${pickups.map(s => { const rs = bookedRes(t).filter(r => r.stopId === s.id), q = rs[0] && rs[0].requestId && reqById(rs[0].requestId);
          return `<li class="${t.rt.status !== 'scheduled' && t.rt.sim.progress >= s.dist - EPS ? 'done' : ''}"><span class="sd num">${s.idx}</span><span><b>${s.short}</b><span class="muted small">${s.home && q ? esc(pickupText(q, 'driver')) : esc(s.place)}، ${studentsAr(rs.length)}، نحو ${fmt(scheduledArrival(t, s.idx))}</span></span></li>`; }).join('')}</ol>
      </div>
      <div class="stack" style="gap:10px">
        <button class="btn btn-teal btn-lg" data-action="nextStop" data-trip="${t.id}" ${active && n >= 0 && !nextIsDest ? '' : 'disabled'}>${ic('map-pin','ic-sm')} وصلت إلى نقطة الاستلام التالية${active && n >= 0 && !nextIsDest ? ` (${t.route.stops[n].short})` : ''}</button>
        <button class="btn btn-ghost" data-action="simStart" data-trip="${t.id}" ${active && !t.rt.sim.running && !atDestination(t) ? '' : 'disabled'}>${ic('navigation','ic-sm')} متابعة الطريق إلى الجامعة</button>
        <button class="btn btn-ghost" data-action="driverArrive" data-trip="${t.id}" ${active && !atDestination(t) ? '' : 'disabled'}>${ic('flag','ic-sm')} تأكيد الوصول إلى الوجهة</button>
        <div class="report">
          <select class="select sm" id="drv-delay" aria-label="مدة التأخير">${[5,10,15].map(m => `<option value="${m}">${m} دقائق</option>`).join('')}</select>
          <select class="select sm" id="drv-reason" aria-label="سبب التأخير"><option>ازدحام مروري</option><option>انتظار طالبة</option><option>حادث على الطريق</option></select>
          <button class="btn btn-ghost btn-sm" data-action="reportDelay" data-trip="${t.id}" ${t.rt.status === 'in_progress' && !atDestination(t) ? '' : 'disabled'}>${ic('timer','ic-sm')} الإبلاغ عن تأخير</button>
        </div>
        <button class="btn btn-danger" data-action="reportBreakdown" data-trip="${t.id}" ${t.rt.status !== 'completed' ? '' : 'disabled'}>${ic('wrench','ic-sm')} الإبلاغ عن عطل في المركبة</button>
      </div>
    </div>
  </section>`;
}

/* ---------- Mobile: "more" menu when a role has many pages ---------- */
function bottomNavHTML(nav, page){
  const btn = n => `<button data-action="go" data-page="${n.id}" ${n.id===page?'aria-current="page"':''}>${ic(n.icon)}<span>${n.label}</span></button>`;
  if (nav.length <= 4) return nav.map(btn).join('');
  const first = nav.slice(0, 3), rest = nav.slice(3);
  return first.map(btn).join('') + `<button data-action="moreNav" aria-expanded="${!!ui.moreOpen}" ${rest.some(n => n.id === page) ? 'aria-current="page"' : ''}>${ic('menu')}<span>المزيد</span></button>
    ${ui.moreOpen ? `<div class="more-sheet" role="menu">${rest.map(n => `<button role="menuitem" data-action="go" data-page="${n.id}" ${n.id===page?'aria-current="page"':''}>${ic(n.icon,'ic-sm')}${n.label}</button>`).join('')}</div>` : ''}`;
}

/* =========================================================
   Actions
   ========================================================= */
function refreshDispatch(){ replan(); }
Object.assign(ACTIONS, {
  scrollRequest(){ if (state.role !== 'student' || state.page.student !== 'home'){ state.role = 'student'; state.page.student = 'home'; render(); } document.getElementById('request')?.scrollIntoView({ behavior:'smooth', block:'start' }); },
  reqPickup(el){ reqDraft().pickupType = el.dataset.type; render(); },
  reqMode(el){ reqDraft().mode = el.dataset.mode; render(); },
  pinMap(el, e){
    const d = reqDraft(), pt = e.target.closest('[data-point]');
    if (pt){ d.pickupType = 'point'; d.pointId = pt.dataset.point; return render(); }
    const svg = el.closest('svg'), p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const m = p.matrixTransform(svg.getScreenCTM().inverse());
    d.pickupType = 'home'; d.home = [Math.round(m.x), Math.round(m.y)]; render();
  },
  submitRequest(){
    const d = reqDraft(), v = validateRequest(d);
    if (v.errors.length){ toastMsg('error', 'تحقق من بيانات الطلب', v.errors[0]); return render(); }
    const b = d.buildingId && buildingById(d.buildingId);
    const q = { id:'RQ-' + (++state.seq), seq:state.seq, studentId:ME, pickup: d.pickupType === 'point' ? { type:'point', pointId:d.pointId } : { type:'home', xy:d.home.slice() },
      campusId:d.campusId, collegeId:d.collegeId || null, buildingId:d.buildingId || null, gateId: b && b.gateId ? b.gateId : d.gateId, mode:d.mode,
      arriveBy: d.mode === 'scheduled' ? d.arriveBy : null, deadline:v.deadline, status:'active', createdAt:state.clock, tripId:null, resId:null };
    state.requests.push(q);
    notify('student', { type:'success', title:'تم استلام الطلب', body:`طلبك ${q.id} إلى ${CAMPUS_BY_ID[q.campusId].name} قيد التجميع مع الطلبات المتوافقة. لا تُرسل مركبة حقيقية في وضع العرض.` });
    log(`طلب استلام جديد ${q.id} من ${me().name} إلى ${CAMPUS_BY_ID[q.campusId].name}`, 'inbox', ['admin']);
    log(`أرسلتِ طلب الاستلام ${q.id}`, 'send', ['student']);
    replan(); render();
    setTimeout(() => document.getElementById('upcoming')?.scrollIntoView({ behavior:'smooth', block:'start' }), 60);
  },
  cancelRequest(el){
    const q = reqById(el.dataset.req); if (!q || q.status !== 'active') return;
    const t = q.tripId && TRIP_BY_ID[q.tripId], r = q.resId && state.reservations.find(x => x.id === q.resId);
    if (t && t.rt.status !== 'scheduled') return toastMsg('warn', 'لا يمكن الإلغاء', 'انطلقت الرحلة بالفعل.');
    confirmDialog({ title:'إلغاء طلب الرحلة؟', body: t ? `سيُحرَّر مقعدك في ${t.bus} ويُحدَّث مسار السائق.` : 'سيُحذف طلبك من التجميع.', confirmText:'إلغاء الطلب', tone:'error', icon:'x',
      onConfirm(){
        if (r && r.status === 'active') cancelReservation(r);
        if (q.status === 'active'){ q.status = 'cancelled'; q.cancelledAt = state.clock; }
        if (!t) notify('student', { type:'cancel', title:'تم إلغاء الطلب', body:`أُلغي طلبك ${q.id}.` });
        log(`أُلغي الطلب ${q.id}`, 'x', ['admin']); replan();
      } });
  },
  dispReplan(){ replan(); toastMsg('info', 'اكتمل التخطيط', `${state.dispatch.proposals.filter(p => p.type === 'assign').length} مجموعات مقترحة.`); render(); },
  dispApprove(el){
    const p = state.dispatch.proposals.find(x => x.id === el.dataset.rec); if (!p) return toastMsg('info', 'تغيّرت التوصيات', 'أعد مراجعة القائمة المحدّثة.');
    const v = VEH_BY_ID[p.vehicleId];
    confirmDialog({ title:'اعتماد تعيين المجموعة؟', icon:'user-check', tone:'navy', confirmText:'اعتماد وتنفيذ', wide:true,
      content:`<ul class="plan"><li>إنشاء رحلة إلى ${CAMPUS_BY_ID[p.campusId].name} على <b>${v.name}</b> مع الكابتن ${DRIVER_BY_ID[p.driverId] ? DRIVER_BY_ID[p.driverId].short : '—'}.</li><li>${studentsAr(p.students)} من ${stopsAr(p.pickups.length)}، الانطلاق ${fmt(p.departure)} والوصول ${fmt(p.arrival)}.</li><li>إشعار الطالبات والسائق.</li></ul>
        ${p.late ? `<div class="notice tone-warn">${ic('alert-triangle','ic-sm')}<div>الوصول المتوقع بعد الموعد المطلوب. يُنصح بإشعار الطالبات.</div></div>` : ''}<p class="muted small">وضع العرض: تُنشأ الرحلة في هذا المتصفح فقط، ولا تُرسل مركبة حقيقية.</p>`,
      onConfirm(){ p.status = 'approved'; if (executeAssign(p)) toastMsg('success', 'نُفّذ التعيين', `${v.name}: ${studentsAr(p.students)}.`); replan(); } });
  },
  dispReject(el){
    const p = state.dispatch.proposals.find(x => x.id === el.dataset.rec); if (!p) return;
    p.status = 'rejected';
    state.dispatch.rejected[groupSig(p.vehicleId, p.requestIds.map(reqById).filter(Boolean))] = true;
    dispatchHistory({ kind:'assign', status:'rejected', title:'رُفض تعيين مجموعة', result:`${VEH_BY_ID[p.vehicleId].name} لـ${studentsAr(p.students)} إلى ${CAMPUS_BY_ID[p.campusId].short}. سيبحث الوكيل عن بديل.` });
    replan(); render();
  },
  dispApproveAll(){
    const list = state.dispatch.proposals.filter(p => p.type === 'assign' && !p.late);
    confirmDialog({ title:`اعتماد ${list.length} توصيات؟`, body:'تُنفَّذ التوصيات غير المتأخرة فقط، وتبقى المتأخرة والحالات التي تحتاج تدخلًا للمراجعة الفردية.', confirmText:'اعتماد الكل', tone:'navy', icon:'check-check',
      onConfirm(){ let ok = 0; list.forEach(p => { p.status = 'approved'; if (executeAssign(p)) ok++; }); replan(); toastMsg('success', 'نُفّذت التوصيات', `${ok} من ${list.length}.`); } });
  },
  cancelBlocked(el){
    const p = state.dispatch.proposals.find(x => x.id === el.dataset.rec); if (!p) return;
    confirmDialog({ title:'إلغاء الطلبات المتأثرة؟', body:`سيُلغى ${p.requestIds.length} طلب وتُشعر الطالبات بالسبب.`, confirmText:'إلغاء وإشعار', tone:'error', icon:'x',
      onConfirm(){
        p.requestIds.map(reqById).filter(q => q && q.status === 'active' && !q.tripId).forEach(q => { q.status = 'cancelled'; q.cancelledAt = state.clock;
          if (q.studentId === ME) notify('student', { type:'cancel', title:'أُلغي طلبك', body:`تعذّر تنفيذ الطلب ${q.id}: ${p.title}. يمكنك تقديم طلب جديد بموعد مختلف.` }); });
        dispatchHistory({ kind:'intervention', status:'executed', title:p.title, result:`أُلغيت ${p.requestIds.length} طلبات مع إشعار الطالبات.` }); replan();
      } });
  },
  monApprove(el){
    const m = monitorDispatch().find(x => x.key === el.dataset.key); if (!m) return toastMsg('info', 'تغيّرت الحالة', 'لم تعد هذه التوصية قائمة.');
    confirmDialog({ title:'اعتماد التوصية؟', icon:'user-check', tone:'navy', confirmText:'اعتماد وتنفيذ', wide:true,
      content:`<p><b>${esc(m.action)}</b></p><ul class="plan">${m.reasons.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`,
      onConfirm(){ executeMonitor(m); state.dispatch.dismissed[m.key] = true; replan(); } });
  },
  monReject(el){
    const m = monitorDispatch().find(x => x.key === el.dataset.key); if (!m) return;
    state.dispatch.dismissed[m.key] = true; dispatchHistory({ kind:m.type, status:'rejected', title:m.title, result:'رفضها المسؤول.' }); render();
  },
  dsimRun(){ ui.dsimResult = simulateDispatch(ui.dsim); render(); },
  dsimCommitRoad(){
    const sc = ui.dsim, p = PICKUPS[sc.area];
    confirmDialog({ title:'تسجيل بلاغ ازدحام فعلي؟', body:`سيُطبَّق على التوجيه الفعلي قرب ${p.short}، وقد يقترح الوكيل تعديل مسارات الرحلات المجدولة.`, confirmText:'تسجيل', tone:'navy', icon:'alert-triangle',
      onConfirm(){ state.incidents.push({ id:'inc-' + (++state.seq), at:[p.x, p.y], radius:120, factor:Number(sc.factor), label:`ازدحام قرب ${p.short}` }); log(`سُجّل بلاغ ازدحام قرب ${p.short}`, 'alert-triangle', ['admin']); ui.dsimResult = null; replan(); } });
  },
  incidentRemove(el){ state.incidents = state.incidents.filter(z => z.id !== el.dataset.id); replan(); render(); },
  vehOps(el){
    const v = VEH_BY_ID[el.dataset.veh]; if (!v) return;
    vState(v).ops = el.value;
    log(`${v.name}: ${OPS_LABEL[el.value]}`, 'wrench', ['admin']);
    if (el.value !== 'active' && vehicleTrips(v).some(t => t.rt.status === 'scheduled' || tripActive(t))) toastMsg('warn', 'مركبة مرتبطة برحلات', 'سيقترح وكيل الإرسال إعادة التعيين للاعتماد.');
    replan(); render();
  },
  vehDriver(el){
    const v = VEH_BY_ID[el.dataset.veh]; if (!v) return;
    const other = VEHICLES.find(x => x !== v && x.pool === 'ondemand' && vState(x).driverId === el.value && el.value);
    if (other){ toastMsg('warn', 'السائق مرتبط بمركبة أخرى', `أزل ${DRIVER_BY_ID[el.value].name} من ${other.name} أولًا.`); return render(); }
    vState(v).driverId = el.value || null; replan(); render();
  },
  drvAvail(el){ state.drivers[el.dataset.drv] = { available: el.checked }; replan(); render(); },
  campusVerify(el){ state.places.campusVerified[el.dataset.campus] = el.checked; render(); },
  placeVerify(el){ const x = state.places[el.dataset.kind].find(y => y.id === el.dataset.id); if (x){ x.verified = !x.verified; replan(); render(); } },
  placeDelete(el){
    if (el.disabled) return;
    const kind = el.dataset.kind, x = state.places[kind].find(y => y.id === el.dataset.id); if (!x) return;
    confirmDialog({ title:`حذف «${x.name}»؟`, body:'يُحذف من قائمة الوجهات. لا يمكن حذف عنصر مستخدم في طلبات أو رحلات نشطة.', confirmText:'حذف', tone:'error', icon:'trash-2',
      onConfirm(){ state.places[kind] = state.places[kind].filter(y => y.id !== x.id); if (kind === 'gates') state.places.buildings.forEach(b => { if (b.gateId === x.id) b.gateId = null; }); replan(); } });
  },
  pfAdd(){
    const f = ui.pf, name = (document.getElementById('pf-name')?.value || '').trim(), verified = !!document.getElementById('pf-verified')?.checked;
    if (name.length < 2) return toastMsg('error', 'الاسم مطلوب', 'أدخل اسمًا من حرفين على الأقل.');
    const coll = { gate:'gates', college:'colleges', building:'buildings' }[f.type];
    if (state.places[coll].some(x => x.campusId === f.campusId && x.name === name)) return toastMsg('error', 'الاسم مكرر', 'يوجد عنصر بالاسم نفسه في هذا المقر.');
    const item = { id: f.type[0] + '-' + (++state.seq), campusId:f.campusId, name, verified };
    if (f.type === 'gate'){
      const xs = document.getElementById('pf-x').value, ys = document.getElementById('pf-y').value;
      if ((xs === '') !== (ys === '')) return toastMsg('error', 'إحداثيات ناقصة', 'أدخل الإحداثيين معًا أو اتركهما فارغين.');
      if (xs !== ''){ const x = Number(xs), y = Number(ys); if (!(x >= 0 && x <= 1000 && y >= 0 && y <= 640)) return toastMsg('error', 'إحداثيات خارج المخطط', 'س بين 0 و1000، وص بين 0 و640.'); item.xy = [x, y]; } else item.xy = null;
    }
    if (f.type === 'building'){ item.collegeId = document.getElementById('pf-college').value || null; item.gateId = document.getElementById('pf-gate').value || null; }
    state.places[coll].push(item);
    log(`أُضيفت وجهة: ${name} (${CAMPUS_BY_ID[f.campusId].name})`, 'plus', ['admin']);
    toastMsg('success', 'أُضيفت الوجهة', `${name}${verified ? '' : '، غير موثقة'}${f.type === 'gate' && !item.xy ? '، بلا إحداثيات' : ''}.`);
    replan(); render();
  },
  driverArrive(el){
    const t = tripFrom(el); if (!tripActive(t)) return;
    if (t.rt.status === 'paused') t.rt.status = 'in_progress';
    let guard = 20; while (!atDestination(t) && guard-- && jumpToNextStop(t));
    toastMsg('success', 'تم تأكيد الوصول', `${t.bus} في ${t.campus.name}. أنهِ الرحلة بعد نزول الطالبات.`); render();
  },
  reportDelay(el){
    const t = tripFrom(el); if (!t || t.rt.status !== 'in_progress') return;
    const m = Number(document.getElementById('drv-delay').value), why = document.getElementById('drv-reason').value;
    addDelay(t, m, `${why} (بلاغ السائق)`); replan(); render();
  },
  reportBreakdown(el){
    const t = tripFrom(el); if (!t) return; const v = VEH_BY_ID[t.vehicleId];
    confirmDialog({ title:'الإبلاغ عن عطل في المركبة؟', body:`ستُسجَّل ${v ? v.name : t.bus} خارج الخدمة${tripActive(t) ? ' وتتوقف الرحلة مؤقتًا' : ''}، ويقترح وكيل الإرسال مركبة بديلة للاعتماد.`, confirmText:'إبلاغ', tone:'error', icon:'wrench',
      onConfirm(){
        if (v) vState(v).ops = 'out_of_service';
        if (t.rt.status === 'in_progress'){ t.rt.status = 'paused'; t.rt.sim.running = false; }
        notify('admin', { type:'warn', title:'بلاغ عطل', body:`${t.bus}: عطل أثناء ${tripLabel(t)}. راجع توصية إعادة التعيين.` });
        log(`بلاغ عطل في ${t.bus}`, 'wrench', ['admin', drvAud(t)]); replan();
      } });
  },
  missPickup(el){
    const r = state.reservations.find(x => x.id === el.dataset.res); if (!r || r.status !== 'active' || r.boarded) return;
    const t = TRIP_BY_ID[r.tripId], s = STUDENT_BY_ID[r.studentId];
    confirmDialog({ title:`تسجيل عدم حضور ${s.name}؟`, body:'تُبلَّغ الطالبة ويُحدَّث عدد الركاب، ويمكن للمركبة متابعة المسار.', confirmText:'تسجيل', tone:'error', icon:'user-x',
      onConfirm(){
        r.status = 'missed'; const q = r.requestId && reqById(r.requestId); if (q && q.status === 'active') q.status = 'missed';
        if (r.studentId === ME) notify('student', { type:'warn', title:'لم يتم الاستلام', body:`سجّل السائق عدم حضورك عند ${stopOf(t, r.stopId).short}. يمكنك تقديم طلب جديد.` });
        log(`عدم حضور: ${s.name} (${stopOf(t, r.stopId).short})`, 'user-x', ['admin', drvAud(t)]);
      } });
  },
  moreNav(){ ui.moreOpen = !ui.moreOpen; render(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('[data-req]')){
    const d = reqDraft(), k = el.dataset.req;
    d[k] = k === 'arriveBy' ? Number(el.value) : el.value;
    if (k === 'campusId'){ d.collegeId = ''; d.buildingId = ''; d.gateId = (routableGates(d.campusId)[0] || state.places.gates.find(g => g.campusId === d.campusId) || {}).id || ''; }
    if (k === 'collegeId') d.buildingId = '';
    render();
  }
  if (el.matches('[data-dsim]')){ const k = el.dataset.dsim; ui.dsim[k] = ['n','deadline','seats','pct'].includes(k) ? Number(el.value) : k === 'factor' ? Number(el.value) : el.value; ui.dsimResult = null; render(); }
  if (el.matches('[data-pf]')){ ui.pf[el.dataset.pf] = el.value; render(); }
});
document.addEventListener('click', e => {
  if (!ui.moreOpen) return;
  const act = e.target.closest('[data-action]');
  if (act && act.dataset.action === 'moreNav') return;
  ui.moreOpen = false;
  if (!act) render();          // actions re-render themselves
});


/* ---------- v5 visual layer: grouped sidebar with route rail ---------- */
const NAV_GROUPS = {
  student:{ home:'رحلتي', tracking:'رحلتي', assistant:'المساعدة', notifications:'المساعدة' },
  driver:{ driver:'الرحلة', tracking:'الرحلة', notifications:'التنبيهات' },
  admin:{ admin:'التشغيل', dispatch:'التشغيل', fleet:'الموارد', places:'الموارد', intel:'الذكاء والمتابعة', tracking:'الذكاء والمتابعة', notifications:'الذكاء والمتابعة' }
};
function sideNavHTML(nav, page, u){
  let last = null;
  return nav.map(n => {
    const g = (NAV_GROUPS[state.role] || {})[n.id];
    const head = g && g !== last ? `<div class="nav-group">${g}</div>` : '';
    last = g;
    return head + `<button class="nav-item" data-action="go" data-page="${n.id}" ${n.id===page?'aria-current="page"':''}><span class="stop" aria-hidden="true"></span>${ic(n.icon)}<span>${n.label}</span>${n.id==='notifications' && u ? `<span class="nav-count num">${u}</span>`:''}</button>`;
  }).join('');
}
/* =========================================================
   Event wiring (one delegated listener per event type) & boot
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (ui.bellOpen && !e.target.closest('.bell-wrap')){ ui.bellOpen = false; if (!el){ render(); return; } }
  if (!el || el.disabled) return;
  if (el.type === 'checkbox') return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('input[type="checkbox"][data-action]')) ACTIONS[el.dataset.action]?.(el);
  if (el.matches('select[data-change]')) ACTIONS[el.dataset.change]?.(el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'askInput'){ e.preventDefault(); askAssistant(e.target.value); }
  if (e.key === 'Escape'){
    if (ui.modal){ ACTIONS.modalCancel(); return; }
    if (ui.toolsOpen || ui.bellOpen){ ui.toolsOpen = false; ui.bellOpen = false; render(); }
  }
});
window.addEventListener('load', () => icons());

state = loadState();
hydrateDynamicTrips();
if (state.dispatch.lastRun == null) replan();
render();
requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });

</script>
